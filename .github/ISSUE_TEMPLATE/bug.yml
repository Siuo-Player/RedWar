name: Bug
description: Reportar um comportamento incorreto ou regressão reproduzível.
title: "[BUG] "
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: O que deve funcionar corretamente depois da correção?
    validations:
      required: true
  - type: input
    id: governing_issue
    attributes:
      label: Governing Issue
      description: Issue que governa este trabalho, por exemplo #371 ou #373.
      placeholder: "#000"
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Gates, commits, configs ou decisões que condicionam o bug.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Workflow / Evidence
      description: Workflow relevante, reprodução, logs ou artefactos esperados.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: Critérios objetivos para considerar a correção concluída.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Passos mínimos para reproduzir, incluindo ambiente quando relevante.
    validations:
      required: true
