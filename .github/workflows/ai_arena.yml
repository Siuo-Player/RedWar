name: RedWar AI Arena

on:
  pull_request:
    paths:
      - 'ai/**'
  workflow_dispatch: # Permite correr o torneio manualmente com um botão na aba Actions!

jobs:
  arena-tournament:
    runs-on: ubuntu-latest
    
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build Cython Evaluator
      run: python setup.py build_ext --inplace

    - name: Run Arena Tournament
      run: python tools/analytics/arena_tournament.py --jogos 50 --margem_vitorias 5