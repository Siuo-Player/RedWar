name: RedWar AI Arena

on:
  # Development Arena: every relevant AI push is evaluated. A branch is
  # serialized so a burst of commits never creates dozens of simultaneous
  # tournaments. Historical AI revisions are tested on the CURRENT main game
  # rules, with only ai/** overlaid from the historical commit. This means a
  # rules/gameplay change naturally invalidates old AIs unless they still win.
  push:
    branches-ignore:
      - main
    paths:
      - 'ai/**'
      - 'tools/analytics/benchmark_engine.py'
      - 'tools/analytics/arena_tournament.py'
      - 'tools/nnue/**'
      - 'tests/cpp_nnue_test.cpp'
      - '.github/workflows/ai_arena.yml'
  workflow_dispatch:

concurrency:
  group: redwar-ai-arena-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'

jobs:
  arena:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - name: Checkout branch history
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Fetch main
      run: git fetch origin main --no-tags

    - name: Select AI commits since main
      shell: bash
      run: |
        set -euo pipefail
        BASE=$(git merge-base HEAD origin/main)
        echo "BASE_SHA=$BASE" >> "$GITHUB_ENV"
        git rev-list --reverse "$BASE..HEAD" > /tmp/all-commits.txt
        : > /tmp/ai-commits.txt

        while read -r COMMIT; do
          FILES=$(git diff-tree --no-commit-id --name-only -r "$COMMIT")
          if echo "$FILES" | grep -Eq '^(ai/|tools/nnue/|tools/analytics/(benchmark_engine|arena_tournament)\.py|tests/cpp_nnue_test\.cpp|\.github/workflows/ai_arena\.yml)'; then
            echo "$COMMIT" >> /tmp/ai-commits.txt
          fi
        done < /tmp/all-commits.txt

        echo "AI commits selected:"
        cat /tmp/ai-commits.txt

    - name: Build current main baseline once
      shell: bash
      run: |
        set -euo pipefail
        git worktree add --detach /tmp/redwar-baseline "$BASE_SHA"
        cd /tmp/redwar-baseline
        cpp_sources=(ai/cpp_engine/board.cpp ai/cpp_engine/evaluate.cpp ai/cpp_engine/main.cpp ai/cpp_engine/movegen.cpp ai/cpp_engine/search.cpp)
        if [[ -f ai/cpp_engine/nnue.cpp ]]; then cpp_sources+=(ai/cpp_engine/nnue.cpp); fi
        g++ -std=c++17 -O3 -march=native -mtune=native -flto -DNDEBUG -pipe "${cpp_sources[@]}" -o ai/cpp_engine/engine
        chmod +x ai/cpp_engine/engine

    - name: Arena each historical AI on current main rules
      shell: bash
      run: |
        set -u
        mkdir -p /tmp/redwar-arena-results
        build_failures=0

        if [[ ! -s /tmp/ai-commits.txt ]]; then
          echo "No AI-related commits in this branch; nothing to benchmark."
          git worktree remove --force /tmp/redwar-baseline || true
          exit 0
        fi

        while read -r COMMIT; do
          echo "============================================================"
          echo "A/B Arena: historical AI $COMMIT vs current main AI"
          echo "Game rules: CURRENT main"
          echo "============================================================"

          WORKTREE="/tmp/redwar-$COMMIT"
          if ! git worktree add --detach "$WORKTREE" "$BASE_SHA"; then
            echo "BUILD FAILURE: could not create current-rules worktree for $COMMIT" | tee "/tmp/redwar-arena-results/${COMMIT}-error.txt"
            build_failures=$((build_failures + 1))
            continue
          fi

          # Replace ONLY the AI layer with the historical revision.
          # engine/, heroes_config.json, UI and all other gameplay rules remain
          # at the current main revision.
          if ! git -C "$WORKTREE" restore --source="$COMMIT" -- ai; then
            echo "INCOMPATIBLE AI: could not overlay ai/ from $COMMIT onto current main rules" | tee "/tmp/redwar-arena-results/${COMMIT}-error.txt"
            git worktree remove --force "$WORKTREE"
            build_failures=$((build_failures + 1))
            continue
          fi

          pushd "$WORKTREE/ai/cpp_engine" >/dev/null
          cpp_sources=(board.cpp evaluate.cpp main.cpp movegen.cpp search.cpp)
          if [[ -f nnue.cpp ]]; then cpp_sources+=(nnue.cpp); fi
          if ! g++ -std=c++17 -O3 -march=native -mtune=native -flto -DNDEBUG -pipe "${cpp_sources[@]}" -o engine; then
            echo "BUILD FAILURE on CURRENT RULES: $COMMIT" | tee "/tmp/redwar-arena-results/${COMMIT}-error.txt"
            popd >/dev/null
            git worktree remove --force "$WORKTREE"
            build_failures=$((build_failures + 1))
            continue
          fi
          chmod +x engine
          popd >/dev/null

          set +e
          python /tmp/redwar-baseline/tools/analytics/arena_tournament.py \
            --challenger-engine "$WORKTREE/ai/cpp_engine/engine" \
            --baseline-engine "/tmp/redwar-baseline/ai/cpp_engine/engine" \
            --jogos 20 \
            --margem-vitorias 3 \
            --nodes 10000 \
            --results "/tmp/redwar-arena-results/${COMMIT}-games.jsonl"
          rc=$?
          set -e
          echo "arena_exit_code=$rc" >> "/tmp/redwar-arena-results/${COMMIT}-arena.txt"

          git worktree remove --force "$WORKTREE"
        done < /tmp/ai-commits.txt

        git worktree remove --force /tmp/redwar-baseline || true
        if [[ "$build_failures" -ne 0 ]]; then
          echo "One or more historical AI revisions were incompatible with or failed against current main rules."
          exit 1
        fi

    - name: Upload AI Arena results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: redwar-ai-arena-${{ github.sha }}
        path: /tmp/redwar-arena-results
        if-no-files-found: warn
        retention-days: 30
