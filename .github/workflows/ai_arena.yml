name: RedWar AI Arena

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'ai/**'
      - 'tools/analytics/benchmark_engine.py'
      - 'tools/analytics/arena_tournament.py'
      - 'tools/nnue/**'
      - 'tests/cpp_nnue_test.cpp'
      - '.github/workflows/ai_arena.yml'
  workflow_dispatch:

concurrency:
  group: redwar-ai-arena-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'

jobs:
  arena:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - name: Checkout branch history
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Fetch main
      run: git fetch origin main --no-tags

    - name: Select AI commits since main
      shell: bash
      run: |
        set -euo pipefail
        BASE=$(git merge-base HEAD origin/main)
        echo "BASE_SHA=$BASE" >> "$GITHUB_ENV"
        git rev-list --reverse "$BASE..HEAD" > /tmp/all-commits.txt
        : > /tmp/ai-commits.txt
        while read -r COMMIT; do
          FILES=$(git diff-tree --no-commit-id --name-only -r "$COMMIT")
          if echo "$FILES" | grep -Eq '^(ai/|tools/nnue/|tools/analytics/(benchmark_engine|arena_tournament)\.py|tests/cpp_nnue_test\.cpp|\.github/workflows/ai_arena\.yml)'; then
            echo "$COMMIT" >> /tmp/ai-commits.txt
          fi
        done < /tmp/all-commits.txt

    - name: Build current main baseline once
      shell: bash
      run: |
        set -euo pipefail
        git worktree add --detach /tmp/redwar-baseline "$BASE_SHA"
        cd /tmp/redwar-baseline
        cpp_sources=(ai/cpp_engine/board.cpp ai/cpp_engine/evaluate.cpp ai/cpp_engine/main.cpp ai/cpp_engine/movegen.cpp ai/cpp_engine/search.cpp)
        if [[ -f ai/cpp_engine/nnue.cpp ]]; then cpp_sources+=(ai/cpp_engine/nnue.cpp); fi
        g++ -std=c++17 -O3 -march=native -mtune=native -flto -DNDEBUG -pipe "${cpp_sources[@]}" -o ai/cpp_engine/engine
        chmod +x ai/cpp_engine/engine

    - name: Arena every AI revision with current rules
      shell: bash
      run: |
        set -u
        mkdir -p /tmp/redwar-arena-results
        current_head_failed=0
        historical_failures=0

        while read -r COMMIT; do
          [[ -z "$COMMIT" ]] && continue
          PREFIX="/tmp/redwar-arena-results/${COMMIT}"
          WORKTREE="/tmp/redwar-$COMMIT"
          echo "============================================================"
          echo "A/B Arena: $COMMIT vs current main AI"
          echo "============================================================"

          if ! git worktree add --detach "$WORKTREE" "$BASE_SHA"; then
            echo "BUILD FAILURE: worktree" | tee "${PREFIX}-error.txt"
            historical_failures=$((historical_failures + 1)); [[ "$COMMIT" == "$GITHUB_SHA" ]] && current_head_failed=1; continue
          fi

          if ! git -C "$WORKTREE" restore --source="$COMMIT" -- ai; then
            echo "INCOMPATIBLE AI: overlay failed" | tee "${PREFIX}-error.txt"
            git worktree remove --force "$WORKTREE"; historical_failures=$((historical_failures + 1)); [[ "$COMMIT" == "$GITHUB_SHA" ]] && current_head_failed=1; continue
          fi

          pushd "$WORKTREE/ai/cpp_engine" >/dev/null
          cpp_sources=(board.cpp evaluate.cpp main.cpp movegen.cpp search.cpp)
          if [[ -f nnue.cpp ]]; then cpp_sources+=(nnue.cpp); fi
          if ! g++ -std=c++17 -O3 -march=native -mtune=native -flto -DNDEBUG -pipe "${cpp_sources[@]}" -o engine 2> >(tee "${PREFIX}-build-stderr.txt" >&2); then
            echo "BUILD FAILURE: $COMMIT" | tee "${PREFIX}-error.txt"
            popd >/dev/null; git worktree remove --force "$WORKTREE"; historical_failures=$((historical_failures + 1)); [[ "$COMMIT" == "$GITHUB_SHA" ]] && current_head_failed=1; continue
          fi
          chmod +x engine
          popd >/dev/null

          # Use the current branch's harness: historical AI is the candidate,
          # while the game rules and test protocol stay current.
          set +e
          python "$GITHUB_WORKSPACE/tools/analytics/arena_tournament.py" \
            --challenger-engine "$WORKTREE/ai/cpp_engine/engine" \
            --baseline-engine "/tmp/redwar-baseline/ai/cpp_engine/engine" \
            --jogos 20 \
            --margem-vitorias 3 \
            --nodes 10000 \
            --results "${PREFIX}-games.jsonl" \
            2>&1 | tee "${PREFIX}-arena.txt"
          rc=${PIPESTATUS[0]}
          set -e
          echo "arena_exit_code=$rc" >> "${PREFIX}-arena.txt"
          if [[ "$rc" -ne 0 ]]; then
            historical_failures=$((historical_failures + 1)); [[ "$COMMIT" == "$GITHUB_SHA" ]] && current_head_failed=1
          fi

          git worktree remove --force "$WORKTREE"
        done < /tmp/ai-commits.txt

        git worktree remove --force /tmp/redwar-baseline || true
        echo "historical_failures=$historical_failures"
        echo "current_head_failed=$current_head_failed"

        # Historical failures are preserved as evidence and identify non-candidates.
        # The current revision itself must pass; otherwise the branch must not merge.
        if [[ "$current_head_failed" -ne 0 ]]; then
          echo "Current AI revision failed Arena validation."
          exit 1
        fi

    - name: Upload AI Arena results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: redwar-ai-arena-${{ github.sha }}
        path: /tmp/redwar-arena-results
        if-no-files-found: warn
        retention-days: 30
