name: RedWar AI Arena

on:
  # Arena is intentionally tied to branch commits, not every PR event.
  # A single branch is serialized below, and each run processes all AI commits
  # since main in chronological order. This prevents a burst of commits from
  # spawning dozens of simultaneous tournaments while still evaluating every
  # AI revision represented by the branch.
  push:
    branches-ignore:
      - main
    paths:
      - 'ai/**'
      - 'tools/analytics/benchmark_engine.py'
      - 'tools/analytics/arena_tournament.py'
      - 'tools/nnue/**'
      - 'tests/cpp_nnue_test.cpp'
      - '.github/workflows/ai_arena.yml'
  workflow_dispatch:

concurrency:
  group: redwar-ai-arena-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'

jobs:
  arena:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - name: Checkout branch history
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Fetch main
      run: git fetch origin main --no-tags

    - name: Select AI commits since main
      shell: bash
      run: |
        set -euo pipefail
        BASE=$(git merge-base HEAD origin/main)
        echo "BASE_SHA=$BASE" >> "$GITHUB_ENV"
        git rev-list --reverse "$BASE..HEAD" > /tmp/all-commits.txt
        : > /tmp/ai-commits.txt

        while read -r COMMIT; do
          FILES=$(git diff-tree --no-commit-id --name-only -r "$COMMIT")
          if echo "$FILES" | grep -Eq '^(ai/|tools/nnue/|tools/analytics/(benchmark_engine|arena_tournament)\.py|tests/cpp_nnue_test\.cpp|\.github/workflows/ai_arena\.yml)'; then
            echo "$COMMIT" >> /tmp/ai-commits.txt
          fi
        done < /tmp/all-commits.txt

        echo "AI commits selected:"
        cat /tmp/ai-commits.txt

    - name: Benchmark each AI commit in order
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p /tmp/redwar-arena-results

        if [[ ! -s /tmp/ai-commits.txt ]]; then
          echo "No AI-related commits in this branch; nothing to benchmark."
          exit 0
        fi

        while read -r COMMIT; do
          echo "============================================================"
          echo "Running AI Arena for commit $COMMIT"
          echo "============================================================"

          WORKTREE="/tmp/redwar-$COMMIT"
          git worktree add --detach "$WORKTREE" "$COMMIT"

          cleanup_worktree() {
            git worktree remove --force "$WORKTREE" 2>/dev/null || true
          }
          trap cleanup_worktree EXIT

          pushd "$WORKTREE/ai/cpp_engine" >/dev/null
          cpp_sources=(board.cpp evaluate.cpp main.cpp movegen.cpp search.cpp)
          if [[ -f nnue.cpp ]]; then cpp_sources+=(nnue.cpp); fi
          g++ -std=c++17 -O3 -march=native -mtune=native -flto -DNDEBUG -pipe "${cpp_sources[@]}" -o engine
          chmod +x engine
          popd >/dev/null

          pushd "$WORKTREE" >/dev/null
          python tools/analytics/benchmark_engine.py \
            --engine ai/cpp_engine/engine \
            | tee "/tmp/redwar-arena-results/${COMMIT}-benchmark.txt"

          python tools/analytics/arena_tournament.py \
            --jogos 100 \
            --margem_vitorias 10 \
            | tee "/tmp/redwar-arena-results/${COMMIT}-arena.txt"
          popd >/dev/null

          trap - EXIT
          git worktree remove --force "$WORKTREE"
        done < /tmp/ai-commits.txt

    - name: Upload AI Arena results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: redwar-ai-arena-${{ github.sha }}
        path: /tmp/redwar-arena-results
        if-no-files-found: warn
        retention-days: 14
