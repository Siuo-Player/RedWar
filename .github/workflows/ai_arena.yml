name: RedWar AI Arena

on:
  pull_request:
    paths:
      - 'ai/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  arena-tournament:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🛡️ Segurança à Porta (Jurisdição Open-Source)
      if: github.event_name == 'pull_request' && github.actor != 'Siuo-Player'
      run: |
        echo "A inspecionar os ficheiros do Pull Request..."
        git fetch origin ${{ github.base_ref }}

        CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)

        for FILE in $CHANGED_FILES; do
          if [[ ! "$FILE" == ai/* ]]; then
            echo "❌ ACESSO NEGADO: O Pull Request tenta alterar o ficheiro '$FILE'."
            echo "A jurisdição open-source do RedWar limita-se ESTRITAMENTE à pasta 'ai/'."
            echo "O PR foi bloqueado antes de entrar na Arena."
            exit 1
          fi
        done
        echo "✅ Inspeção aprovada. Todos os ficheiros pertencem ao Ares Engine (ai/)."

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build Cython Evaluator
      run: python setup.py build_ext --inplace

    - name: Build C++ Engine (Linux)
      run: |
        cd ai/cpp_engine
        g++ -std=c++17 -O3 -march=native -mtune=native -flto -DNDEBUG -pipe board.cpp evaluate.cpp main.cpp movegen.cpp search.cpp -o engine
        chmod +x engine

    - name: Run Arena Tournament
      run: python tools/analytics/arena_tournament.py --jogos 100 --margem_vitorias 10
