name: RedWar AI Arena

on:
  pull_request:
    paths:
      - 'ai/**'
      - 'engine/**'

jobs:
  arena-tournament:
    runs-on: ubuntu-latest

    steps:
    - name: Fazer Checkout do Código
      uses: actions/checkout@v4

    - name: Configurar ambiente Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Instalar Dependências do Motor
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Correr Testes Unitários Base
      run: |
        pytest tests/

    - name: ⚔️ Combate de Validação da IA (Brute-Force)
      run: |
        # Corre 100 jogos para garantir amostra estatística confiável
        python ai/arena_tournament.py --jogos 100 --threshold 55.0