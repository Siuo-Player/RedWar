name: RedWar AI Arena

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sem a diretiva 'cancel-in-progress', os torneios longos entram em fila 
# e terminam todos de forma sequencial, garantindo que nenhum jogo é perdido.

jobs:
  arena-tournament:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v3

      - name: Instalar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Executar Torneio da Arena
        run: |
          python tools/analytics/arena_tournament.py --jogos 50 --margem_vitorias 5

      - name: Commit e Push dos Resultados
        run: |
          git config --global user.name "RedWar Arena Bot"
          git config --global user.email "actions@github.com"
          git add *.json ai/*.json || true
          git commit -m "🏆 AI Arena: Torneio de validação (50 jogos) concluído" || echo "Sem alterações para gravar"
          git push