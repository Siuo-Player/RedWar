name: RedWar AI Arena

on:
  pull_request:
    paths:
      - 'ai/**'
      - 'tools/analytics/benchmark_engine.py'
      - 'tools/nnue/**'
      - 'tests/cpp_nnue_test.cpp'
      - '.github/workflows/ai_arena.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PERF_GUARD: ${{ startsWith(github.event.pull_request.title, 'perf(') || startsWith(github.event.pull_request.title, 'perf:') }}

jobs:
  benchmark-regression:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Build and benchmark base
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        git worktree add --detach /tmp/redwar-base "$BASE_SHA"
        cd /tmp/redwar-base/ai/cpp_engine
        if [[ -f nnue.cpp ]]; then
          g++ -std=c++17 -O3 -march=native -mtune=native -flto -DNDEBUG -pipe board.cpp evaluate.cpp main.cpp movegen.cpp nnue.cpp search.cpp -o engine-benchmark
        else
          g++ -std=c++17 -O3 -march=native -mtune=native -flto -DNDEBUG -pipe board.cpp evaluate.cpp main.cpp movegen.cpp search.cpp -o engine-benchmark
        fi
        cd "$GITHUB_WORKSPACE"
        python tools/analytics/benchmark_engine.py --engine /tmp/redwar-base/ai/cpp_engine/engine-benchmark | tee /tmp/base-benchmark.txt

    - name: Build and benchmark PR HEAD
      env:
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        git worktree add --detach /tmp/redwar-head "$HEAD_SHA"
        cd /tmp/redwar-head/ai/cpp_engine
        if [[ -f nnue.cpp ]]; then
          g++ -std=c++17 -O3 -march=native -mtune=native -flto -DNDEBUG -pipe board.cpp evaluate.cpp main.cpp movegen.cpp nnue.cpp search.cpp -o engine-benchmark
        else
          g++ -std=c++17 -O3 -march=native -mtune=native -flto -DNDEBUG -pipe board.cpp evaluate.cpp main.cpp movegen.cpp search.cpp -o engine-benchmark
        fi
        cd "$GITHUB_WORKSPACE"
        python tools/analytics/benchmark_engine.py --engine /tmp/redwar-head/ai/cpp_engine/engine-benchmark | tee /tmp/head-benchmark.txt

    - name: Compare base vs PR HEAD
      run: |
        previous_median=$(sed -n 's/^median_seconds=//p' /tmp/base-benchmark.txt)
        current_median=$(sed -n 's/^median_seconds=//p' /tmp/head-benchmark.txt)
        previous_bestmove=$(sed -n 's/^bestmove=//p' /tmp/base-benchmark.txt)
        current_bestmove=$(sed -n 's/^bestmove=//p' /tmp/head-benchmark.txt)

        python - "$previous_median" "$current_median" <<'PY'
import sys
previous = float(sys.argv[1])
current = float(sys.argv[2])
print(f"base_median={previous:.6f}s")
print(f"head_median={current:.6f}s")
print(f"relative_change={(current - previous) / previous * 100.0:.2f}%")
PY

        if [[ "$PERF_GUARD" == "true" ]]; then
          slowdown=$(python - "$previous_median" "$current_median" <<'PY'
import sys
previous = float(sys.argv[1])
current = float(sys.argv[2])
print(current > previous * 1.10)
PY
)
          if [[ "$slowdown" == "True" ]]; then
            echo "ERROR: performance regression >10% (${previous_median}s -> ${current_median}s)"
            exit 1
          fi
        fi

        if [[ "$current_bestmove" != "$previous_bestmove" ]]; then
          echo "info: bestmove changed: $previous_bestmove -> $current_bestmove"
        fi

    - name: Upload benchmark comparison
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: redwar-ai-benchmark-comparison-${{ github.event.pull_request.number }}
        path: |
          /tmp/base-benchmark.txt
          /tmp/head-benchmark.txt
        if-no-files-found: error

    - name: Cleanup worktrees
      if: always()
      run: git worktree prune

  arena-tournament:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Security boundary
      if: github.event_name == 'pull_request' && github.actor != 'Siuo-Player'
      run: |
        echo "Inspecting pull request files..."
        git fetch origin ${{ github.base_ref }}
        CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
        for FILE in $CHANGED_FILES; do
          if [[ ! "$FILE" == ai/* && ! "$FILE" == tools/analytics/benchmark_engine.py && ! "$FILE" == tools/nnue/* && ! "$FILE" == tests/cpp_nnue_test.cpp && ! "$FILE" == .github/workflows/ai_arena.yml ]]; then
            echo "ACCESS DENIED: pull request modifies '$FILE' outside the AI/benchmark boundary."
            exit 1
          fi
        done
        echo "Inspection approved."
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Build Cython Evaluator
      run: python setup.py build_ext --inplace
    - name: Build C++ Engine (Linux)
      run: |
        cd ai/cpp_engine
        if [[ -f nnue.cpp ]]; then
          g++ -std=c++17 -O3 -march=native -mtune=native -flto -DNDEBUG -pipe board.cpp evaluate.cpp main.cpp movegen.cpp nnue.cpp search.cpp -o engine
        else
          g++ -std=c++17 -O3 -march=native -mtune=native -flto -DNDEBUG -pipe board.cpp evaluate.cpp main.cpp movegen.cpp search.cpp -o engine
        fi
        chmod +x engine
    - name: Run Arena Tournament
      run: python tools/analytics/arena_tournament.py --jogos 100 --margem_vitorias 10
