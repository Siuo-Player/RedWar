name: Apply Ignite Second-Stun Patch

on:
  push:
    branches:
      - state21/issue392-ignite-second-stun-2026-09-10

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch and remove temporary workflow
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path('engine/game_state.py'): (
                  '''                    target = self.board[fr][fc]\n                    if target and target.stun_timer < 2:\n                        self.remove_piece_hash(fr, fc)\n                        target.stun_timer = 2\n                        self.add_piece_hash(fr, fc, target)\n''',
                  '''                    target = self.board[fr][fc]\n                    if not target:\n                        continue\n                    self.remove_piece_hash(fr, fc)\n                    if target.stun_timer > 0:\n                        captured_real_piece |= target.lifespan is None\n                        self.board[fr][fc] = None\n                    else:\n                        target.stun_timer = 2\n                        self.add_piece_hash(fr, fc, target)\n'''
              ),
              Path('ai/cpp_engine/board.cpp'): (
                  '''                    Piece target = board.pieces[fr][fc];\n                    if (!target.is_empty && target.stun_timer < 2) {\n                        if (undo.num_victims >= MAX_UNDO_VICTIMS) throw std::runtime_error("UndoInfo victim capacity exceeded");\n                        undo.aoe_victims[undo.num_victims++] = {fr, fc, target};\n                        target.stun_timer = 2;\n                        update_piece(fr, fc, target);\n                    }\n''',
                  '''                    Piece target = board.pieces[fr][fc];\n                    if (target.is_empty) continue;\n                    if (undo.num_victims >= MAX_UNDO_VICTIMS) throw std::runtime_error("UndoInfo victim capacity exceeded");\n                    undo.aoe_victims[undo.num_victims++] = {fr, fc, target};\n                    if (target.stun_timer > 0) {\n                        update_piece(fr, fc, Piece{});\n                        if (target.lifespan >= 999) board.twc = 0;\n                    } else {\n                        target.stun_timer = 2;\n                        update_piece(fr, fc, target);\n                    }\n'''
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8-sig')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one ignite block, found {text.count(old)}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          Path('tests/test_ignite_second_stun_contract.py').write_text(r'''from __future__ import annotations

import os
import subprocess
from pathlib import Path

from engine.game_state import GameState
from engine.pieces import criar_peca_por_nome

ROOT = Path(__file__).resolve().parents[1]
BRIDGE_NAME = "cpp_make_unmake_bridge_test.exe" if os.name == "nt" else "cpp_make_unmake_bridge_test"
BRIDGE = ROOT / BRIDGE_NAME


def put(gs: GameState, row: int, col: int, name: str, team: str, *, stun: int = 0, lifespan=None) -> None:
    piece = criar_peca_por_nome(name, team)
    piece.stun_timer = stun
    piece.lifespan = lifespan
    gs.board[row][col] = piece


def ignite(gs: GameState) -> None:
    gs.execute_action({
        "type": "spell",
        "start": (4, 4),
        "end": (4, 5),
        "spell_name": "ignite",
    })


def test_python_ignite_first_stun_applies_timer_and_preserves_piece() -> None:
    state = GameState()
    put(state, 4, 4, "Pyromancer", "brancas")
    put(state, 4, 5, "Templar", "pretas")

    ignite(state)

    target = state.board[4][5]
    assert target is not None
    assert target.stun_timer == 1
    assert state.turns_without_capture == 1


def test_python_ignite_second_stun_kills_and_counts_permanent_capture() -> None:
    state = GameState()
    put(state, 4, 4, "Pyromancer", "brancas")
    put(state, 4, 5, "Templar", "pretas", stun=2)

    ignite(state)

    assert state.board[4][5] is None
    assert state.turns_without_capture == 0


def test_python_ignite_second_stun_destroys_temporary_piece_without_capture() -> None:
    state = GameState()
    put(state, 4, 4, "Pyromancer", "brancas")
    put(state, 4, 5, "Ghoul", "pretas", stun=2, lifespan=3)
    state.turns_without_capture = 11
    state.compute_initial_hash()

    ignite(state)

    assert state.board[4][5] is None
    assert state.turns_without_capture == 12


def test_cpp_ignite_first_and_second_stun_match_python_and_unmake() -> None:
    assert BRIDGE.exists(), f"C++ bridge binary missing: {BRIDGE}. Run build_cpp_engine.py --bridge-test."

    states = []
    for label, stun, lifespan in (
        ("first", 0, None),
        ("second", 2, None),
        ("temporary-second", 2, 3),
    ):
        state = GameState()
        put(state, 4, 4, "Pyromancer", "brancas")
        put(state, 4, 5, "Ghoul" if lifespan is not None else "Templar", "pretas", stun=stun, lifespan=lifespan)
        if label == "temporary-second":
            state.turns_without_capture = 11
        state.compute_initial_hash()
        before = state.to_rwen()
        after = state.fast_clone()
        ignite(after)
        states.append((label, before, after.to_rwen(), "SPELL ignite E4 F4"))

    payload = "".join(f"{before}\n{move}\n" for _label, before, _after, move in states)
    result = subprocess.run([str(BRIDGE)], input=payload, text=True, capture_output=True, cwd=ROOT, check=False)
    assert result.returncode == 0, result.stderr or result.stdout

    lines = [line for line in result.stdout.splitlines() if line]
    assert len(lines) == len(states) * 2
    for index, (label, before, expected_after, _move) in enumerate(states):
        actual_after = lines[index * 2].removeprefix("AFTER ")
        restored = lines[index * 2 + 1].removeprefix("RESTORED ")
        assert actual_after == expected_after, f"{label}: Python/C++ ignite mismatch"
        assert restored == before, f"{label}: C++ make/unmake did not restore the root"
''', encoding='utf-8')

          Path('.github/workflows/_apply_ignite_fix.yml').unlink()

      - name: Commit final source and tests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engine/game_state.py ai/cpp_engine/board.cpp tests/test_ignite_second_stun_contract.py .github/workflows/_apply_ignite_fix.yml
          git commit -m 'fix: enforce ignite second-stun death across engines'
          git push
