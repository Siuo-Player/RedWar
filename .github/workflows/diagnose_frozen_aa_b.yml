name: RedWar Frozen A/A-B Diagnostic

on:
  push:
    branches:
      - 'diagnostic/frozen-aa-b-root-cause-*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve frozen engine
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin 504578b30b95350b8d63f7565eea4df1553b7c30 --no-tags
          git worktree add --detach /tmp/redwar-frozen 504578b30b95350b8d63f7565eea4df1553b7c30
          pushd /tmp/redwar-frozen/ai/cpp_engine >/dev/null
          g++ -std=c++17 -O3 -march=native -mtune=native -flto -DNDEBUG -pipe \
            board.cpp evaluate.cpp main.cpp movegen.cpp search.cpp nnue.cpp -o engine
          chmod +x engine
          popd >/dev/null

      - name: Capture native failure
        run: |
          python tools/analytics/diagnose_frozen_aa_b.py \
            --engine /tmp/redwar-frozen/ai/cpp_engine/engine

      - name: Cleanup
        if: always()
        run: git worktree remove --force /tmp/redwar-frozen || true
