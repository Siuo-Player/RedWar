name: Protect main (fallback)

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  guard:
    if: github.actor != 'Siuo-Player' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect direct pushes not originating from a merged PR
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          unauthorized=()
          while IFS= read -r sha; do
            [ -z "$sha" ] && continue
            merged_pr="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${REPOSITORY}/commits/${sha}/pulls" \
              --jq 'any(.[]; .base.ref == "main" and .merged_at != null)')"
            if [ "$merged_pr" != "true" ]; then
              unauthorized+=("$sha")
            fi
          done < <(git rev-list --reverse "${BEFORE}..${AFTER}")

          if [ "${#unauthorized[@]}" -eq 0 ]; then
            echo "No unauthorized direct commits detected."
            exit 0
          fi

          echo "ERROR: direct commits to main detected that do not originate from merged PRs."
          printf 'Unauthorized commit: %s\n' "${unauthorized[@]}"
          echo "Use branch protection / pull requests to correct this state."
          exit 1
