name: RedWar Ares Authoritative Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - feat/ares-controlled-lmr-2026-09-15
  workflow_dispatch:

concurrency:
  group: redwar-ares-authoritative-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'

jobs:
  authoritative:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Prepare
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            git fetch origin main --no-tags
            base="$(git rev-parse origin/main)"
          fi
          echo "BASE=$base" >> "$GITHUB_ENV"
          git diff --name-only "$base...HEAD" > /tmp/changed-files.txt
          if grep -Eq '^ai/cpp_engine/(evaluate|search|nnue)\.(cpp|h|hpp|cc|cxx)$|^tools/nnue/' /tmp/changed-files.txt; then
            echo 'strength_sensitive=true' >> "$GITHUB_OUTPUT"
          else
            echo 'strength_sensitive=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Build challenger
        if: steps.prepare.outputs.strength_sensitive == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/redwar-quality-head HEAD
          cd /tmp/redwar-quality-head
          sources=(ai/cpp_engine/board.cpp ai/cpp_engine/evaluate.cpp ai/cpp_engine/main.cpp ai/cpp_engine/movegen.cpp ai/cpp_engine/search.cpp)
          [ -f ai/cpp_engine/nnue.cpp ] && sources+=(ai/cpp_engine/nnue.cpp)
          g++ -std=c++17 -O3 -march=native -mtune=native -flto -DNDEBUG -pipe "${sources[@]}" -o ai/cpp_engine/engine
          chmod +x ai/cpp_engine/engine
      - name: Build baseline
        if: steps.prepare.outputs.strength_sensitive == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/redwar-quality-base HEAD
          git -C /tmp/redwar-quality-base restore --source="$BASE" -- ai
          cd /tmp/redwar-quality-base
          sources=(ai/cpp_engine/board.cpp ai/cpp_engine/evaluate.cpp ai/cpp_engine/main.cpp ai/cpp_engine/movegen.cpp ai/cpp_engine/search.cpp)
          [ -f ai/cpp_engine/nnue.cpp ] && sources+=(ai/cpp_engine/nnue.cpp)
          g++ -std=c++17 -O3 -march=native -mtune=native -flto -DNDEBUG -pipe "${sources[@]}" -o ai/cpp_engine/engine
          chmod +x ai/cpp_engine/engine
      - name: Protected tactical suite
        if: steps.prepare.outputs.strength_sensitive == 'true'
        run: python /tmp/redwar-quality-head/tools/analytics/tactical_benchmark_suite.py --engine /tmp/redwar-quality-head/ai/cpp_engine/engine --nodes 10 --nodes 100 --nodes 1000
      - name: Deterministic search comparator
        if: steps.prepare.outputs.strength_sensitive == 'true'
        shell: bash
        run: |
          set -euo pipefail
          (cd /tmp/redwar-quality-base && python tools/analytics/move_ordering_baseline.py --all-cases --nodes 10 25 50 75 100 150 200 300 500 1000 --output /tmp/reference.json)
          (cd /tmp/redwar-quality-head && python tools/analytics/move_ordering_baseline.py --all-cases --nodes 10 25 50 75 100 150 200 300 500 1000 --output /tmp/candidate.json)
          python tools/analytics/compare_search_baseline.py /tmp/reference.json /tmp/candidate.json
      - name: Authoritative promotion gate
        if: steps.prepare.outputs.strength_sensitive == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/promotion
          results=()
          decision=continue
          version="${{ github.event.pull_request.head.sha || github.sha }}"
          for stage in 96 192 320 512; do
            result="/tmp/promotion/stage-${stage}.jsonl"
            summary="/tmp/promotion/gate-${stage}.json"
            python /tmp/redwar-quality-head/tools/analytics/promotion_arena.py --challenger-engine /tmp/redwar-quality-head/ai/cpp_engine/engine --baseline-engine /tmp/redwar-quality-base/ai/cpp_engine/engine --stage-games "$stage" --nodes 10000 --results "$result" --challenger-version "$version" --baseline-version "$BASE" --rules-version "$version"
            results+=(--results "$result")
            python /tmp/redwar-quality-head/tools/analytics/promotion_gate.py "${results[@]}" --bootstrap-replicates 2000 --bootstrap-seed 0 --summary-output "$summary" || true
            decision="$(python -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8"))["decision"])' "$summary")"
            echo "stage=$stage decision=$decision"
            [ "$decision" = accept ] && break
            [ "$decision" = reject ] && exit 1
          done
          [ "$decision" = accept ]
      - name: Upload evidence
        if: always() && steps.prepare.outputs.strength_sensitive == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: redwar-ares-authoritative-${{ github.event.pull_request.number || github.run_id }}
          path: |
            /tmp/changed-files.txt
            /tmp/reference.json
            /tmp/candidate.json
            /tmp/promotion/*.jsonl
            /tmp/promotion/*.json
          if-no-files-found: warn
          retention-days: 30
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          git worktree remove --force /tmp/redwar-quality-base 2>/dev/null || true
          git worktree remove --force /tmp/redwar-quality-head 2>/dev/null || true
