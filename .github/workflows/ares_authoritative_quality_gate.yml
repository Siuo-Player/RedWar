name: RedWar Ares Authoritative Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: redwar-ares-authoritative-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'

jobs:
  ares-authoritative-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - name: Checkout PR history
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Fetch PR base
      run: git fetch origin "${{ github.event.pull_request.base.ref || 'main' }}" --no-tags
    - name: Detect strength-sensitive changes
      id: changes
      shell: bash
      run: |
        set -euo pipefail
        BASE="${{ github.event.pull_request.base.sha }}"
        git diff --name-only "$BASE...HEAD" > /tmp/changed-files.txt
        cat /tmp/changed-files.txt
        if grep -Eq '^(ai/cpp_engine/(evaluate|search|nnue)\.(cpp|h|hpp|cc|cxx)|tools/nnue/)' /tmp/changed-files.txt; then
          echo "strength_sensitive=true" >> "$GITHUB_OUTPUT"
        else
          echo "strength_sensitive=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Build challenger
      if: steps.changes.outputs.strength_sensitive == 'true'
      shell: bash
      run: |
        set -euo pipefail
        git worktree add --detach /tmp/redwar-quality-head HEAD
        cd /tmp/redwar-quality-head
        cpp_sources=(ai/cpp_engine/board.cpp ai/cpp_engine/evaluate.cpp ai/cpp_engine/main.cpp ai/cpp_engine/movegen.cpp ai/cpp_engine/search.cpp)
        if [[ -f ai/cpp_engine/nnue.cpp ]]; then cpp_sources+=(ai/cpp_engine/nnue.cpp); fi
        g++ -std=c++17 -O3 -march=native -mtune=native -flto -DNDEBUG -pipe "${cpp_sources[@]}" -o ai/cpp_engine/engine
        chmod +x ai/cpp_engine/engine
    - name: Build baseline from PR base
      if: steps.changes.outputs.strength_sensitive == 'true'
      shell: bash
      run: |
        set -euo pipefail
        BASE="${{ github.event.pull_request.base.sha }}"
        git worktree add --detach /tmp/redwar-quality-base HEAD
        git -C /tmp/redwar-quality-base restore --source="$BASE" -- ai
        cd /tmp/redwar-quality-base
        cpp_sources=(ai/cpp_engine/board.cpp ai/cpp_engine/evaluate.cpp ai/cpp_engine/main.cpp ai/cpp_engine/movegen.cpp ai/cpp_engine/search.cpp)
        if [[ -f ai/cpp_engine/nnue.cpp ]]; then cpp_sources+=(ai/cpp_engine/nnue.cpp); fi
        g++ -std=c++17 -O3 -march=native -mtune=native -flto -DNDEBUG -pipe "${cpp_sources[@]}" -o ai/cpp_engine/engine
        chmod +x ai/cpp_engine/engine
    - name: Run protected tactical suite
      if: steps.changes.outputs.strength_sensitive == 'true'
      run: |
        set -euo pipefail
        python /tmp/redwar-quality-head/tools/analytics/tactical_benchmark_suite.py --engine /tmp/redwar-quality-head/ai/cpp_engine/engine --nodes 10 --nodes 100 --nodes 1000 | tee /tmp/protected-tactical-suite.txt
    - name: Compare deterministic search baseline
      if: steps.changes.outputs.strength_sensitive == 'true'
      run: |
        set -euo pipefail
        (cd /tmp/redwar-quality-base && python tools/analytics/move_ordering_baseline.py --all-cases --nodes 10 25 50 75 100 150 200 300 500 1000 --output /tmp/search-baseline-reference.json)
        (cd /tmp/redwar-quality-head && python tools/analytics/move_ordering_baseline.py --all-cases --nodes 10 25 50 75 100 150 200 300 500 1000 --output /tmp/search-baseline-candidate.json)
        python tools/analytics/compare_search_baseline.py /tmp/search-baseline-reference.json /tmp/search-baseline-candidate.json | tee /tmp/search-baseline-comparison.txt
    - name: Run authoritative promotion Arena
      if: steps.changes.outputs.strength_sensitive == 'true'
      run: |
        set -euo pipefail
        BASE="${{ github.event.pull_request.base.sha }}"
        RULES_VERSION="${{ github.sha }}"
        PROMOTION_DIR=/tmp/authoritative-promotion
        mkdir -p "$PROMOTION_DIR"
        result_files=()
        final_decision=continue
        for stage in 96 192 320 512; do
          result_file="$PROMOTION_DIR/stage-${stage}.jsonl"
          summary_file="$PROMOTION_DIR/gate-${stage}.json"
          python /tmp/redwar-quality-head/tools/analytics/promotion_arena.py --challenger-engine /tmp/redwar-quality-head/ai/cpp_engine/engine --baseline-engine /tmp/redwar-quality-base/ai/cpp_engine/engine --stage-games "$stage" --nodes 10000 --results "$result_file" --challenger-version "$RULES_VERSION" --baseline-version "$BASE" --rules-version "$RULES_VERSION"
          result_files+=(--results "$result_file")
          set +e
          python /tmp/redwar-quality-head/tools/analytics/promotion_gate.py "${result_files[@]}" --bootstrap-replicates 2000 --bootstrap-seed 0 --summary-output "$summary_file" | tee "/tmp/promotion-gate-${stage}.txt"
          gate_status=${PIPESTATUS[0]}
          set -e
          decision="$(python - "$summary_file" <<'PY'
import json, sys
print(json.loads(open(sys.argv[1], encoding='utf-8').read())['decision'])
PY
)"
          echo "authoritative_gate stage=${stage} decision=${decision} exit=${gate_status}"
          if [ "$decision" = "accept" ]; then final_decision=accept; break; fi
          if [ "$decision" = "reject" ]; then echo "Authoritative promotion gate rejected challenger at ${stage} games."; exit 1; fi
        done
        if [ "$final_decision" != "accept" ]; then echo "Authoritative promotion gate did not reach acceptance."; exit 1; fi
    - name: Upload authoritative evidence
      if: always() && steps.changes.outputs.strength_sensitive == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: redwar-ares-authoritative-${{ github.event.pull_request.number }}
        path: |
          /tmp/changed-files.txt
          /tmp/protected-tactical-suite.txt
          /tmp/search-baseline-reference.json
          /tmp/search-baseline-candidate.json
          /tmp/search-baseline-comparison.txt
          /tmp/authoritative-promotion/stage-*.jsonl
          /tmp/authoritative-promotion/gate-*.json
          /tmp/promotion-gate-*.txt
        if-no-files-found: warn
        retention-days: 30
    - name: Cleanup worktrees
      if: always()
      run: |
        git worktree remove --force /tmp/redwar-quality-base 2>/dev/null || true
        git worktree remove --force /tmp/redwar-quality-head 2>/dev/null || true
