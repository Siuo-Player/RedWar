name: RedWar Ares Strength Experiment

on:
  workflow_dispatch:
    inputs:
      games:
        description: 'Number of A/B games (must be even for complete pairs)'
        required: false
        default: '100'
        type: string
      nodes:
        description: 'Node budget per move'
        required: false
        default: '10000'
        type: string
      baseline_ref:
        description: 'Exact baseline ref/commit. Defaults to origin/main.'
        required: false
        default: 'origin/main'
        type: string
      challenger_ref:
        description: 'Exact challenger engine ref/commit. Defaults to this workflow commit.'
        required: false
        default: 'HEAD'
        type: string
      population_id:
        description: 'Strength population identifier'
        required: false
        default: 'ares-dev-population-v1'
        type: string
      selection_policy:
        description: 'How controllers/games are selected'
        required: false
        default: 'paired-fixed-openings'
        type: string
      controller_population:
        description: 'Controller population represented by the experiment'
        required: false
        default: 'Ares-v1-vs-baseline-v1'
        type: string
      skill_context:
        description: 'Skill/controller-strength context'
        required: false
        default: 'fixed-node-budget'
        type: string
      opening_seeds:
        description: 'Ordered 16-seed opening set, comma-separated'
        required: false
        default: '101,211,307,401,503,601,709,809,907,1009,1103,1201,1301,1409,1501,1601'
        type: string
      seed_policy:
        description: 'Declared seed policy stored in experiment provenance'
        required: false
        default: 'canonical-opening-book-v1'
        type: string
      seed_generation_rule:
        description: 'Declared seed-generation rule stored in experiment provenance'
        required: false
        default: 'canonical-opening-book-v1'
        type: string
  push:
    branches:
      - 'experiment/strength/**'
      - '!experiment/strength/replication-seed-b-*'

permissions:
  contents: read

jobs:
  strength-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve and build baseline
        shell: bash
        env:
          BASELINE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.baseline_ref || 'origin/main' }}
          CHALLENGER_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.challenger_ref || github.sha }}
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          BASE_SHA=$(git rev-parse "${BASELINE_REF}^{commit}")
          CHALLENGER_SHA=$(git rev-parse "${CHALLENGER_REF}^{commit}")
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          echo "BASELINE_REF=$BASELINE_REF" >> "$GITHUB_ENV"
          echo "CHALLENGER_SHA=$CHALLENGER_SHA" >> "$GITHUB_ENV"
          echo "CHALLENGER_REF=$CHALLENGER_REF" >> "$GITHUB_ENV"
          git worktree add --detach /tmp/redwar-baseline "$BASE_SHA"
          pushd /tmp/redwar-baseline/ai/cpp_engine >/dev/null
          cpp_sources=(board.cpp evaluate.cpp main.cpp movegen.cpp search.cpp)
          if [[ -f nnue.cpp ]]; then cpp_sources+=(nnue.cpp); fi
          g++ -std=c++17 -O3 -march=native -mtune=native -flto -DNDEBUG -pipe "${cpp_sources[@]}" -o engine
          chmod +x engine
          popd >/dev/null

      - name: Run long strength experiment
        shell: bash
        env:
          GAMES: ${{ github.event_name == 'workflow_dispatch' && inputs.games || '100' }}
          NODES: ${{ github.event_name == 'workflow_dispatch' && inputs.nodes || '10000' }}
          OPENING_SEEDS: ${{ github.event_name == 'workflow_dispatch' && inputs.opening_seeds || '101,211,307,401,503,601,709,809,907,1009,1103,1201,1301,1409,1501,1601' }}
          SEED_POLICY: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_policy || 'canonical-opening-book-v1' }}
          SEED_GENERATION_RULE: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_generation_rule || 'canonical-opening-book-v1' }}
        run: |
          set -u
          if (( GAMES % 2 != 0 )); then
            echo 'games must be even so each opening has paired colours.'
            exit 2
          fi
          mkdir -p /tmp/redwar-strength-results
          WORKTREE="/tmp/redwar-$CHALLENGER_SHA"
          PREFIX="/tmp/redwar-strength-results/$GITHUB_SHA"
          git worktree add --detach "$WORKTREE" "$CHALLENGER_SHA"
          pushd "$WORKTREE/ai/cpp_engine" >/dev/null
          cpp_sources=(board.cpp evaluate.cpp main.cpp movegen.cpp search.cpp)
          if [[ -f nnue.cpp ]]; then cpp_sources+=(nnue.cpp); fi
          if ! g++ -std=c++17 -O3 -march=native -mtune=native -flto -DNDEBUG -pipe "${cpp_sources[@]}" -o engine; then
            echo 'challenger build failed'
            popd >/dev/null
            git worktree remove --force "$WORKTREE"
            git worktree remove --force /tmp/redwar-baseline
            exit 1
          fi
          chmod +x engine
          popd >/dev/null

          set +e
          python "$GITHUB_WORKSPACE/tools/analytics/arena_tournament.py" \
            --challenger-engine "$WORKTREE/ai/cpp_engine/engine" \
            --baseline-engine "/tmp/redwar-baseline/ai/cpp_engine/engine" \
            --challenger-version "$CHALLENGER_SHA" \
            --baseline-version "$BASE_SHA" \
            --rules-version "$BASE_SHA" \
            --jogos "$GAMES" \
            --margem-vitorias 0 \
            --nodes "$NODES" \
            --opening-seeds "$OPENING_SEEDS" \
            --seed-policy "$SEED_POLICY" \
            --seed-generation-rule "$SEED_GENERATION_RULE" \
            --results "${PREFIX}-games.jsonl" \
            2>&1 | tee "${PREFIX}-arena.txt"
          rc=${PIPESTATUS[0]}
          set -e

          echo "arena_exit_code=$rc" | tee -a "${PREFIX}-arena.txt"
          git worktree remove --force "$WORKTREE"
          git worktree remove --force /tmp/redwar-baseline

          echo "$rc" > "${PREFIX}-arena.exitcode"
          exit 0

      - name: Validate experiment dataset
        if: always()
        shell: bash
        env:
          GAMES: ${{ github.event_name == 'workflow_dispatch' && inputs.games || '100' }}
        run: |
          set -euo pipefail
          PREFIX="/tmp/redwar-strength-results/$GITHUB_SHA"
          RESULTS="${PREFIX}-games.jsonl"
          VALIDATION="${PREFIX}-validation.json"
          if [[ ! -f "$RESULTS" ]]; then
            echo "Missing Arena JSONL result: $RESULTS"
            exit 1
          fi
          python - "$RESULTS" "$VALIDATION" "$GAMES" "$CHALLENGER_SHA" "$BASE_SHA" "$BASE_SHA" <<'PY'
          import json
          import sys
          from pathlib import Path
          from tools.analytics.arena_experiment_validation import validate_experiment_records

          results_path = Path(sys.argv[1])
          validation_path = Path(sys.argv[2])
          games_expected = int(sys.argv[3])
          challenger_version = sys.argv[4]
          baseline_version = sys.argv[5]
          rules_version = sys.argv[6]

          records = [
              json.loads(line)
              for line in results_path.read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          if not records:
              raise SystemExit("Arena JSONL is empty")

          experiment = records[0].get("experiment")
          metadata = {
              "challenger_version": challenger_version,
              "baseline_version": baseline_version,
              "rules_version": rules_version,
              "node_budget": int(experiment["node_budget"]),
              "games": games_expected,
              "opening_count": int(experiment["opening_count"]),
          }
          audit = validate_experiment_records(records, metadata)
          validation_path.write_text(
              json.dumps(audit, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(audit, ensure_ascii=False, indent=2))
          if audit["invalid_games"]:
              raise SystemExit(
                  f"Experiment contains {audit['invalid_games']} invalid game(s); "
                  "strength inference is blocked."
              )
          if audit["incomplete_valid_pair_ids"]:
              raise SystemExit(
                  "Experiment contains incomplete valid pairs: "
                  + ", ".join(audit["incomplete_valid_pair_ids"])
              )
          PY

      - name: Attach Strength context diagnostics
        if: always()
        shell: bash
        env:
          POPULATION_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.population_id || 'ares-dev-population-v1' }}
          SELECTION_POLICY: ${{ github.event_name == 'workflow_dispatch' && inputs.selection_policy || 'paired-fixed-openings' }}
          CONTROLLER_POPULATION: ${{ github.event_name == 'workflow_dispatch' && inputs.controller_population || 'Ares-v1-vs-baseline-v1' }}
          SKILL_CONTEXT: ${{ github.event_name == 'workflow_dispatch' && inputs.skill_context || 'fixed-node-budget' }}
        run: |
          set -euo pipefail
          PREFIX="/tmp/redwar-strength-results/$GITHUB_SHA"
          RESULTS="${PREFIX}-games.jsonl"
          CONTEXT_RESULTS="${PREFIX}-games.context.jsonl"
          SUMMARY="${PREFIX}-games.jsonl.summary.json"
          if [[ ! -f "$RESULTS" || ! -f "$SUMMARY" ]]; then
            echo "Arena artifacts unavailable; context diagnostics cannot be generated."
            exit 1
          fi
          python "$GITHUB_WORKSPACE/tools/analytics/strength_context_artifacts.py" \
            "$RESULTS" \
            --summary "$SUMMARY" \
            --context-output "$CONTEXT_RESULTS" \
            --population-id "$POPULATION_ID" \
            --selection-policy "$SELECTION_POLICY" \
            --controller-population "$CONTROLLER_POPULATION" \
            --skill-context "$SKILL_CONTEXT"

      - name: Validate Strength population context
        if: always()
        shell: bash
        env:
          GAMES: ${{ github.event_name == 'workflow_dispatch' && inputs.games || '100' }}
          POPULATION_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.population_id || 'ares-dev-population-v1' }}
          SELECTION_POLICY: ${{ github.event_name == 'workflow_dispatch' && inputs.selection_policy || 'paired-fixed-openings' }}
          CONTROLLER_POPULATION: ${{ github.event_name == 'workflow_dispatch' && inputs.controller_population || 'Ares-v1-vs-baseline-v1' }}
          SKILL_CONTEXT: ${{ github.event_name == 'workflow_dispatch' && inputs.skill_context || 'fixed-node-budget' }}
        run: |
          set -euo pipefail
          PREFIX="/tmp/redwar-strength-results/$GITHUB_SHA"
          RESULTS="${PREFIX}-games.context.jsonl"
          if [[ ! -f "$RESULTS" ]]; then
            echo "Missing contextualized Arena JSONL result: $RESULTS"
            exit 1
          fi
          python - "$RESULTS" "$GAMES" "$CHALLENGER_SHA" "$BASE_SHA" "$BASE_SHA" "$POPULATION_ID" "$SELECTION_POLICY" "$CONTROLLER_POPULATION" "$SKILL_CONTEXT" <<'PY'
          import json
          import sys
          from pathlib import Path
          from tools.analytics.arena_experiment_validation import validate_experiment_records

          records = [
              json.loads(line)
              for line in Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          experiment = records[0]["experiment"]
          metadata = {
              "challenger_version": sys.argv[3],
              "baseline_version": sys.argv[4],
              "rules_version": sys.argv[5],
              "node_budget": int(experiment["node_budget"]),
              "games": int(sys.argv[2]),
              "opening_count": int(experiment["opening_count"]),
              "strength_population": {
                  "population_id": sys.argv[6],
                  "selection_policy": sys.argv[7],
                  "controller_population": sys.argv[8],
                  "skill_context": sys.argv[9],
              },
          }
          audit = validate_experiment_records(
              records,
              metadata,
              require_strength_population=True,
          )
          print(json.dumps(audit, ensure_ascii=False, indent=2))
          PY

      - name: Upload experiment artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ares-strength-experiment-${{ github.sha }}
          path: /tmp/redwar-strength-results/
          if-no-files-found: warn
          retention-days: 30
