name: RedWar Ares Strength Experiment

on:
  workflow_dispatch:
    inputs:
      games:
        description: 'Number of A/B games (must be even for complete pairs)'
        required: false
        default: '100'
        type: string
      nodes:
        description: 'Node budget per move'
        required: false
        default: '10000'
        type: string
      baseline_ref:
        description: 'Exact baseline ref/commit. Defaults to origin/main.'
        required: false
        default: 'origin/main'
        type: string

permissions:
  contents: read

jobs:
  strength-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve and build baseline
        shell: bash
        env:
          BASELINE_REF: ${{ inputs.baseline_ref }}
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          BASE_SHA=$(git rev-parse "${BASELINE_REF}^{commit}")
          if [[ "$BASE_SHA" == "$GITHUB_SHA" ]]; then
            echo "Invalid experiment: challenger and baseline resolve to the same commit: $BASE_SHA"
            exit 2
          fi
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          echo "BASELINE_REF=$BASELINE_REF" >> "$GITHUB_ENV"
          git worktree add --detach /tmp/redwar-baseline "$BASE_SHA"
          pushd /tmp/redwar-baseline/ai/cpp_engine >/dev/null
          cpp_sources=(board.cpp evaluate.cpp main.cpp movegen.cpp search.cpp)
          if [[ -f nnue.cpp ]]; then cpp_sources+=(nnue.cpp); fi
          g++ -std=c++17 -O3 -march=native -mtune=native -flto -DNDEBUG -pipe "${cpp_sources[@]}" -o engine
          chmod +x engine
          popd >/dev/null

      - name: Run long strength experiment
        shell: bash
        env:
          GAMES: ${{ inputs.games }}
          NODES: ${{ inputs.nodes }}
        run: |
          set -u
          if (( GAMES % 2 != 0 )); then
            echo 'games must be even so each opening has paired colours.'
            exit 2
          fi
          mkdir -p /tmp/redwar-strength-results
          WORKTREE="/tmp/redwar-$GITHUB_SHA"
          PREFIX="/tmp/redwar-strength-results/$GITHUB_SHA"
          git worktree add --detach "$WORKTREE" "$GITHUB_SHA"
          pushd "$WORKTREE/ai/cpp_engine" >/dev/null
          cpp_sources=(board.cpp evaluate.cpp main.cpp movegen.cpp search.cpp)
          if [[ -f nnue.cpp ]]; then cpp_sources+=(nnue.cpp); fi
          if ! g++ -std=c++17 -O3 -march=native -mtune=native -flto -DNDEBUG -pipe "${cpp_sources[@]}" -o engine; then
            echo 'challenger build failed'
            popd >/dev/null
            git worktree remove --force "$WORKTREE"
            git worktree remove --force /tmp/redwar-baseline
            exit 1
          fi
          chmod +x engine
          popd >/dev/null

          set +e
          python "$GITHUB_WORKSPACE/tools/analytics/arena_tournament.py" \
            --challenger-engine "$WORKTREE/ai/cpp_engine/engine" \
            --baseline-engine "/tmp/redwar-baseline/ai/cpp_engine/engine" \
            --challenger-version "$GITHUB_SHA" \
            --baseline-version "$BASE_SHA" \
            --rules-version "$BASE_SHA" \
            --jogos "$GAMES" \
            --margem-vitorias 0 \
            --nodes "$NODES" \
            --results "${PREFIX}-games.jsonl" \
            2>&1 | tee "${PREFIX}-arena.txt"
          rc=${PIPESTATUS[0]}
          set -e

          echo "arena_exit_code=$rc" | tee -a "${PREFIX}-arena.txt"
          git worktree remove --force "$WORKTREE"
          git worktree remove --force /tmp/redwar-baseline

          echo "$rc" > "${PREFIX}-arena.exitcode"
          exit 0

      - name: Validate experiment dataset
        if: always()
        shell: bash
        env:
          GAMES: ${{ inputs.games }}
        run: |
          set -euo pipefail
          PREFIX="/tmp/redwar-strength-results/$GITHUB_SHA"
          RESULTS="${PREFIX}-games.jsonl"
          VALIDATION="${PREFIX}-validation.json"
          if [[ ! -f "$RESULTS" ]]; then
            echo "Missing Arena JSONL result: $RESULTS"
            exit 1
          fi
          python - "$RESULTS" "$VALIDATION" "$GAMES" "$GITHUB_SHA" "$BASE_SHA" "$BASE_SHA" <<'PY'
          import json
          import sys
          from pathlib import Path
          from tools.analytics.arena_experiment_validation import validate_experiment_records

          results_path = Path(sys.argv[1])
          validation_path = Path(sys.argv[2])
          games_expected = int(sys.argv[3])
          challenger_version = sys.argv[4]
          baseline_version = sys.argv[5]
          rules_version = sys.argv[6]

          records = [
              json.loads(line)
              for line in results_path.read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          if not records:
              raise SystemExit("Arena JSONL is empty")

          experiment = records[0].get("experiment")
          metadata = {
              "challenger_version": challenger_version,
              "baseline_version": baseline_version,
              "rules_version": rules_version,
              "node_budget": int(experiment["node_budget"]),
              "games": games_expected,
              "opening_count": int(experiment["opening_count"]),
          }
          audit = validate_experiment_records(records, metadata)
          validation_path.write_text(
              json.dumps(audit, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(audit, ensure_ascii=False, indent=2))
          if audit["invalid_games"]:
              raise SystemExit(
                  f"Experiment contains {audit['invalid_games']} invalid game(s); "
                  "strength inference is blocked."
              )
          if audit["incomplete_valid_pair_ids"]:
              raise SystemExit(
                  "Experiment contains incomplete valid pairs: "
                  + ", ".join(audit["incomplete_valid_pair_ids"])
              )
          PY

      - name: Upload experiment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ares-strength-experiment-${{ github.sha }}
          path: /tmp/redwar-strength-results/
          if-no-files-found: warn
          retention-days: 30
