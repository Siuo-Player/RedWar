name: Debug Strength Dataset Digest

on:
  push:
    branches:
      - feat/real-arena-scientific-dataset-2026-08-27

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Print canonical digest candidates
        run: |
          python - <<'PY'
          import copy
          import hashlib
          import json
          from tools.analytics.strength_dataset import _canonical_digest

          path = "data/arena/strength/2026-08-27-control-100.json"
          payload = json.loads(open(path, encoding="utf-8").read())
          print(f"current={_canonical_digest(payload)}")

          def digest(value):
              text = json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":"))
              return hashlib.sha256(text.encode("utf-8")).hexdigest()

          variants = {}
          v = copy.deepcopy(payload)
          v["manifest"].pop("canonical_sha256", None)
          v.pop("independent_units", None)
          variants["no_independent_units"] = digest(v)
          v = copy.deepcopy(payload)
          v["manifest"].pop("canonical_sha256", None)
          v["manifest"].pop("source_artifact", None)
          variants["no_source_artifact"] = digest(v)
          v = copy.deepcopy(payload)
          v["manifest"].pop("canonical_sha256", None)
          v.pop("independent_units", None)
          v["manifest"].pop("source_artifact", None)
          variants["no_units_no_source"] = digest(v)
          v = copy.deepcopy(payload)
          v["manifest"].pop("canonical_sha256", None)
          variants["manifest_only"] = digest(v["manifest"])
          v = copy.deepcopy(payload)
          v["manifest"].pop("canonical_sha256", None)
          variants["manifest_plus_games"] = digest({"manifest": v["manifest"], "games": v["games"]})
          for name, value in variants.items():
              print(f"{name}={value}")
          PY
