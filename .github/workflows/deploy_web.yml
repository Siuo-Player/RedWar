name: Deploy RedWar Web Client to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'deploy/web/**'
      - '.github/workflows/deploy_web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure endpoints for GitHub Pages deployment
        shell: bash
        run: |
          if [ -n "${{ vars.REDWAR_WS_URL }}" ]; then
            echo "window.REDWAR_WS_URL = '${{ vars.REDWAR_WS_URL }}';" >> deploy/web/config.js
          fi
          if [ -n "${{ vars.REDWAR_API_URL }}" ]; then
            echo "window.REDWAR_API_URL = '${{ vars.REDWAR_API_URL }}';" >> deploy/web/config.js
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'deploy/web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
