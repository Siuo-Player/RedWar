name: Stage Ares LMR experiment

on:
  push:
    branches:
      - feat/ares-controlled-lmr-2026-09-15

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.head_commit.message != 'chore(ares): apply controlled LMR search experiment' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply conservative LMR transform
        shell: python
        run: |
          from pathlib import Path

          path = Path("ai/cpp_engine/search.cpp")
          text = path.read_text(encoding="utf-8")

          marker = '''StunContinuation continuation_after_move(\n    const Move& move,\n    char moving_team,\n    const StunContinuation& continuation\n) {'''
          helper = '''constexpr int LMR_MIN_DEPTH = 4;\nconstexpr std::size_t LMR_MIN_MOVE_INDEX = 3;\nconstexpr int LMR_REDUCTION = 1;\n\nbool eligible_for_lmr(\n    const Move& move,\n    int depth,\n    int ply,\n    std::size_t move_index,\n    const Move& tt_best_move,\n    const StunContinuation& continuation\n) {\n    if (depth < LMR_MIN_DEPTH || ply < 2) return false;\n    if (move_index < LMR_MIN_MOVE_INDEX) return false;\n    if (continuation.active) return false;\n    if (move == tt_best_move) return false;\n    if (move.type != "MOVE") return false;\n    return true;\n}\n\nint lmr_child_depth(int child_depth) {\n    return std::max(1, child_depth - LMR_REDUCTION);\n}\n\n'''
          if helper in text:
              raise SystemExit("LMR transform already applied")
          if marker not in text:
              raise SystemExit("search.cpp marker not found")
          text = text.replace(marker, helper + marker, 1)

          old_white = '''        bool first_move = true;\n        for (const Move& move : moves) {\n            UndoInfo undo = make_move(move);\n            const int child_depth = child_depth_for_move(move, depth, current_turn, continuation);\n            const StunContinuation child_continuation = continuation_after_move(move, current_turn, continuation);\n            int value;\n            if (first_move) {\n                value = alpha_beta(child_depth, alpha, beta, board.turn, ply + 1, child_continuation);\n                first_move = false;\n            } else {\n                value = alpha_beta(child_depth, alpha, alpha + 1, board.turn, ply + 1, child_continuation);\n                if (!abort_search && value > alpha && value < beta) {\n                    value = alpha_beta(child_depth, alpha, beta, board.turn, ply + 1, child_continuation);\n                }\n            }\n            unmake_move(move, undo);'''
          new_white = '''        bool first_move = true;\n        for (std::size_t move_index = 0; move_index < moves.size(); ++move_index) {\n            const Move& move = moves[move_index];\n            UndoInfo undo = make_move(move);\n            const int child_depth = child_depth_for_move(move, depth, current_turn, continuation);\n            const StunContinuation child_continuation = continuation_after_move(move, current_turn, continuation);\n            int value;\n            if (first_move) {\n                value = alpha_beta(child_depth, alpha, beta, board.turn, ply + 1, child_continuation);\n                first_move = false;\n            } else if (eligible_for_lmr(move, depth, ply, move_index, tt_best_move, continuation)) {\n                value = alpha_beta(lmr_child_depth(child_depth), alpha, alpha + 1, board.turn, ply + 1, child_continuation);\n                if (!abort_search && value > alpha) {\n                    value = alpha_beta(child_depth, alpha, beta, board.turn, ply + 1, child_continuation);\n                }\n            } else {\n                value = alpha_beta(child_depth, alpha, alpha + 1, board.turn, ply + 1, child_continuation);\n                if (!abort_search && value > alpha && value < beta) {\n                    value = alpha_beta(child_depth, alpha, beta, board.turn, ply + 1, child_continuation);\n                }\n            }\n            unmake_move(move, undo);'''
          if old_white not in text:
              raise SystemExit("white alpha-beta loop marker not found")
          text = text.replace(old_white, new_white, 1)

          old_black = '''    bool first_move = true;\n    for (const Move& move : moves) {\n        UndoInfo undo = make_move(move);\n        const int child_depth = child_depth_for_move(move, depth, current_turn, continuation);\n        const StunContinuation child_continuation = continuation_after_move(move, current_turn, continuation);\n        int value;\n        if (first_move) {\n            value = alpha_beta(child_depth, alpha, beta, board.turn, ply + 1, child_continuation);\n            first_move = false;\n        } else {\n            value = alpha_beta(child_depth, beta - 1, beta, board.turn, ply + 1, child_continuation);\n            if (!abort_search && value < beta && value > alpha) {\n                value = alpha_beta(child_depth, alpha, beta, board.turn, ply + 1, child_continuation);\n            }\n        }\n        unmake_move(move, undo);'''
          new_black = '''    bool first_move = true;\n    for (std::size_t move_index = 0; move_index < moves.size(); ++move_index) {\n        const Move& move = moves[move_index];\n        UndoInfo undo = make_move(move);\n        const int child_depth = child_depth_for_move(move, depth, current_turn, continuation);\n        const StunContinuation child_continuation = continuation_after_move(move, current_turn, continuation);\n        int value;\n        if (first_move) {\n            value = alpha_beta(child_depth, alpha, beta, board.turn, ply + 1, child_continuation);\n            first_move = false;\n        } else if (eligible_for_lmr(move, depth, ply, move_index, tt_best_move, continuation)) {\n            value = alpha_beta(lmr_child_depth(child_depth), beta - 1, beta, board.turn, ply + 1, child_continuation);\n            if (!abort_search && value < beta) {\n                value = alpha_beta(child_depth, alpha, beta, board.turn, ply + 1, child_continuation);\n            }\n        } else {\n            value = alpha_beta(child_depth, beta - 1, beta, board.turn, ply + 1, child_continuation);\n            if (!abort_search && value < beta && value > alpha) {\n                value = alpha_beta(child_depth, alpha, beta, board.turn, ply + 1, child_continuation);\n            }\n        }\n        unmake_move(move, undo);'''
          if old_black not in text:
              raise SystemExit("black alpha-beta loop marker not found")
          text = text.replace(old_black, new_black, 1)

          path.write_text(text, encoding="utf-8")
          print("LMR transform applied")

      - name: Validate source shape
        run: |
          git diff --check
          grep -q 'constexpr int LMR_REDUCTION = 1;' ai/cpp_engine/search.cpp
          grep -q 'eligible_for_lmr' ai/cpp_engine/search.cpp
          grep -q 'lmr_child_depth' ai/cpp_engine/search.cpp

      - name: Commit transformed search
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai/cpp_engine/search.cpp
          git diff --cached --exit-code && exit 1 || true
          git commit -m "chore(ares): apply controlled LMR search experiment"
          git push origin HEAD:feat/ares-controlled-lmr-2026-09-15
