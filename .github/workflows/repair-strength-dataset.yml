name: Repair Strength Dataset Integrity

on:
  push:
    branches:
      - feat/real-arena-scientific-dataset-2026-08-27

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[strength-repair]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Recompute canonical dataset and reconcile derived audit
        run: |
          python - <<'PY'
          import json
          import hashlib
          from pathlib import Path

          dataset_path = Path("data/arena/strength/2026-08-27-control-100.json")
          audit_path = Path("data/arena/strength/2026-08-27-control-100.audit.json")

          payload = json.loads(dataset_path.read_text(encoding="utf-8"))
          manifest = payload["manifest"]
          manifest.pop("canonical_sha256", None)
          canonical = json.dumps(
              payload,
              ensure_ascii=False,
              sort_keys=True,
              separators=(",", ":"),
          )
          digest = hashlib.sha256(canonical.encode("utf-8")).hexdigest()
          manifest["canonical_sha256"] = digest
          dataset_path.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          audit = json.loads(audit_path.read_text(encoding="utf-8"))
          audit["source_dataset_canonical_sha256"] = digest
          audit_path.write_text(
              json.dumps(audit, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          print(f"canonical_sha256={digest}")
          expected = "bc396752a0791437d487f4aaa5dde57721a6db99930789228f951447a2cbd165"
          if digest != expected:
              raise SystemExit(f"unexpected canonical digest: {digest}")
          PY

      - name: Restore clean regression test and remove temporary diagnostics
        run: |
          git checkout 5ea462db3029c06bc0e36954fc8d45ea743584b9 -- tests/test_strength_dataset.py
          rm -f .github/workflows/debug-strength-digest.yml .github/workflows/repair-strength-dataset.yml

      - name: Commit repaired state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/arena/strength/2026-08-27-control-100.json data/arena/strength/2026-08-27-control-100.audit.json tests/test_strength_dataset.py .github/workflows/debug-strength-digest.yml .github/workflows/repair-strength-dataset.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix(strength): repair canonical dataset integrity [strength-repair]"
          git push
