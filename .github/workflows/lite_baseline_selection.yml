name: RedWar Lite Ares Baseline Selection

on:
  workflow_dispatch:
    inputs:
      pairs:
        description: "Matched colour-swapped self-play pairs per candidate"
        required: false
        default: "8"
      replay_checks:
        description: "Deterministic replay checks per candidate"
        required: false
        default: "1"

concurrency:
  group: redwar-lite-baseline-selection
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  baseline-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Ares engine
        run: |
          cd ai/cpp_engine
          g++ -std=c++17 -O3 -DNDEBUG -pipe \
            board.cpp evaluate.cpp main.cpp movegen.cpp nnue.cpp search.cpp \
            -o engine

      - name: Compute immutable experiment identities
        id: identity
        run: |
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "rules_version=$(git rev-parse HEAD:docs/GAME_RULES.md)" >> "$GITHUB_OUTPUT"

      - name: Run controlled baseline-selection experiment
        run: |
          python tools/analytics/lite_baseline_selection.py \
            --source-sha "${{ steps.identity.outputs.source_sha }}" \
            --rules-version "${{ steps.identity.outputs.rules_version }}" \
            --pairs "${{ inputs.pairs }}" \
            --replay-checks "${{ inputs.replay_checks }}" \
            --output /tmp/redwar-lite-ares-baseline-selection.json

      - name: Upload raw baseline-selection evidence
        uses: actions/upload-artifact@v7
        with:
          name: redwar-lite-ares-baseline-selection-${{ github.run_id }}
          path: /tmp/redwar-lite-ares-baseline-selection.json
          if-no-files-found: error
