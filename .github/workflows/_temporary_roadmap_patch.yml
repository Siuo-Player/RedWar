name: temporary roadmap patch

on:
  push:
    branches:
      - docs/issue401-roadmap-state-2026-09-10

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update roadmap
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path("docs/ROADMAP.md")
          text = p.read_text(encoding="utf-8")
          baseline = "**Baseline operacional:** `main` @ `7095258388ef71e4dad2dd178c5be6f95e061337`"
          text = re.sub(r"\*\*Baseline operacional:\*\* `main` @ `[0-9a-f]+`", baseline, text, count=1)
          start = "### Progresso atual\n\n"
          end = "\n\nCritério de saída:"
          i = text.index(start) + len(start)
          j = text.index(end, i)
          progress = (
              "- **Concluído:** surrender canónico e hardening do fluxo terminal; segundo STUN do Ignite com TWC/paridade Python-C++; autoridade de spell declarations sem whitelist duplicada.\n"
              "- **Concluído:** **#396/#397** — autoridade de validação canónica de pre-match draft/placement e integração nos chamadores existentes (Pygame draft/start e treino). O #397 foi merged em `7095258388ef71e4dad2dd178c5be6f95e061337`; Test Suite #2036, CodeQL #727 e AI Quality Gate passaram.\n"
              "- **Concluído no contrato:** timing de efeitos foi explicitado: a criação não consome o primeiro tick; o timer avança quando o lado proprietário se torna ativo. Fire aplica stun elegível na transição; ice impede passagem/centro Nevada. O contrato está em `docs/DECISIONS/2026-09-10-pre-match-and-effect-timing-contract.md` e há regressão explícita para a posse temporal."
          )
          text = text[:i] + progress + text[j:]
          p.write_text(text, encoding="utf-8")
      - name: Remove temporary workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/_temporary_roadmap_patch.yml
          git add docs/ROADMAP.md .github/workflows/_temporary_roadmap_patch.yml
          git diff --cached --check
          git commit -m "docs: record gameplay pre-match integration state"
          git push origin HEAD:docs/issue401-roadmap-state-2026-09-10
