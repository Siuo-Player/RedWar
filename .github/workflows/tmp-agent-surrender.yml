name: tmp-agent-surrender-fix

on:
  push:
    branches:
      - fix/battle-surrender-ui-2026-09-11

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch battle surrender control
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("main.py")
          text = path.read_text(encoding="utf-8")

          old = '        self.btn_voltar_menu = pygame.Rect(0, 0, 0, 0)\n'
          new = old + '        self.btn_surrender = pygame.Rect(0, 0, 0, 0)\n'
          if old not in text:
              raise SystemExit("missing button state anchor")
          text = text.replace(old, new, 1)

          old = '        elif self.fase_atual == "BATALHA" and self.gs.white_to_move and not self.gs.game_over:\n'
          new = '''        elif self.fase_atual == "BATALHA":\n            if self.btn_surrender.collidepoint(pos) and self.gs.white_to_move and not self.gs.game_over:\n                if self.modo_predador and self.pondering_active and self.bot_ativo is not None and hasattr(self.bot_ativo, "stop_pondering"):\n                    self.bot_ativo.stop_pondering()\n                    self.pondering_active = False\n                self.gs.execute_action({"type": "surrender", "actor_team": "brancas"})\n                self.casa_selecionada = None\n                return\n\n            if not self.gs.white_to_move or self.gs.game_over:\n                return\n\n'''
          if old not in text:
              raise SystemExit("missing battle-click anchor")
          text = text.replace(old, new, 1)

          old = '''            else:\n                if self.hover_pos and self.gs.board[self.hover_pos[0]][self.hover_pos[1]]:\n                    desenhar_painel_heroi(self.ecra, self.gs.board[self.hover_pos[0]][self.hover_pos[1]], painel_x, 20, 350, h - 40)\n                else:\n                    desenhar_log(self.ecra, self.gs, painel_x, 20, 350, h - 40)\n\n            if self.casa_selecionada:\n'''
          new = '''            else:\n                if self.fase_atual == "BATALHA":\n                    self.btn_surrender = pygame.Rect(\n                        off_x,\n                        min(h - 42, off_y_tab + LINHAS * tam_casa + 54),\n                        128,\n                        34,\n                    )\n                    enabled = self.gs.white_to_move and not self.gs.game_over\n                    pygame.draw.rect(\n                        self.ecra,\n                        COLORS["danger"] if enabled else (75, 75, 75),\n                        self.btn_surrender,\n                        border_radius=7,\n                    )\n                    pygame.draw.rect(\n                        self.ecra,\n                        COLORS["text"],\n                        self.btn_surrender,\n                        1,\n                        border_radius=7,\n                    )\n                    f_surrender = FontManager.get("arial", 17, bold=True)\n                    label = "Desistir" if enabled else "Desistir (turno)"\n                    txt = f_surrender.render(label, True, COLORS["text"])\n                    self.ecra.blit(txt, txt.get_rect(center=self.btn_surrender.center))\n                elif self.hover_pos and self.gs.board[self.hover_pos[0]][self.hover_pos[1]]:\n                    desenhar_painel_heroi(self.ecra, self.gs.board[self.hover_pos[0]][self.hover_pos[1]], painel_x, 20, 350, h - 40)\n                else:\n                    desenhar_log(self.ecra, self.gs, painel_x, 20, 350, h - 40)\n\n            if self.casa_selecionada:\n'''
          if old not in text:
              raise SystemExit("missing battle-render anchor")
          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate syntax and targeted contract
        run: |
          python -m py_compile main.py
          python -m pytest tests/test_surrender_action_contract.py

      - name: Commit patch and remove bootstrap workflow
        run: |
          rm .github/workflows/tmp-agent-surrender.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py .github/workflows/tmp-agent-surrender.yml
          git commit -m "fix(ui): add accessible battle surrender control"
          git push origin HEAD
