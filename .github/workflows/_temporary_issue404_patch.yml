name: temporary issue404 patch

on:
  push:
    branches:
      - state21/issue404-canonical-terminal-action-space-2026-09-10

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply canonical terminal action-space patch
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path("engine/game_state.py")
          text = p.read_text(encoding="utf-8")
          pattern = re.compile(r"        has_move = False\n        active_team = \"brancas\" if self\.white_to_move else \"pretas\"\n        for r in range\(LINHAS\):.*?            if has_move:\n                break\n", re.S)
          replacement = "        from engine.legal_actions import legal_actions\n        has_move = bool(legal_actions(self))\n"
          text2, count = pattern.subn(replacement, text, count=1)
          assert count == 1, "terminal action scan anchor missing"
          p.write_text(text2, encoding="utf-8")

          t = Path("tests/test_terminal_action_space_authority.py")
          t.write_text('''import copy\n\nimport pytest\n\nfrom engine.game_state import GameState\nfrom engine.legal_actions import legal_actions\nfrom engine.pieces import HERO_DEFS, criar_peca_por_nome\n\n\ndef test_no_legal_action_termination_uses_canonical_action_space(monkeypatch):\n    original = copy.deepcopy(HERO_DEFS["Ranger"])\n    patched = copy.deepcopy(original)\n    patched["spells"] = []\n    monkeypatch.setitem(HERO_DEFS, "Ranger", patched)\n\n    gs = GameState()\n    gs.board[4][4] = criar_peca_por_nome("Ranger", "brancas")\n    gs.board[4][6] = criar_peca_por_nome("Bone", "pretas")\n\n    assert legal_actions(gs) == ()\n    gs.check_game_over()\n    assert gs.game_over is True\n    assert "Oponente Bloqueado" in gs.winner\n\n\ndef test_valid_no_action_state_still_terminates():\n    gs = GameState()\n    gs.board[0][0] = criar_peca_por_nome("Obelisk", "brancas")\n    gs.board[7][7] = criar_peca_por_nome("Obelisk", "pretas")\n    for col in range(1, 8):\n        gs.board[0][col] = criar_peca_por_nome("StoneWall", "brancas")\n    assert legal_actions(gs) == ()\n    gs.check_game_over()\n    assert gs.game_over is True\n    assert "Oponente Bloqueado" in gs.winner\n''', encoding="utf-8")
      - name: Remove temporary workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/_temporary_issue404_patch.yml
          git add engine/game_state.py tests/test_terminal_action_space_authority.py .github/workflows/_temporary_issue404_patch.yml
          git diff --cached --check
          git commit -m "fix: use canonical action-space for no-action termination"
          git push origin HEAD:state21/issue404-canonical-terminal-action-space-2026-09-10
