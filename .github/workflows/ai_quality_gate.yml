name: RedWar AI Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: redwar-ai-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'

jobs:
  ai-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - name: Checkout PR history
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Fetch PR base
      run: git fetch origin "${{ github.event.pull_request.base.ref || 'main' }}" --no-tags

    - name: Detect AI and quality changes
      id: changes
      shell: bash
      run: |
        set -euo pipefail
        BASE="${{ github.event.pull_request.base.sha }}"
        git diff --name-only "$BASE...HEAD" > /tmp/changed-files.txt

        if grep -Eq '^(ai/.*\.(py|pyx|pyi|cpp|hpp|h|c|cc|cxx)$|tools/nnue/)' /tmp/changed-files.txt; then
          echo "has_ai_changes=true" >> "$GITHUB_OUTPUT"
          echo "AI engine/NNUE changes detected."
        else
          echo "has_ai_changes=false" >> "$GITHUB_OUTPUT"
          echo "No AI engine/NNUE changes detected."
        fi

        if grep -Eq '^(ai/.*\.(py|pyx|pyi|cpp|hpp|h|c|cc|cxx)$|tools/nnue/|tools/analytics/(benchmark_engine|arena_tournament|frostmage_benchmark)\.py|tests/(cpp_nnue_test|test_frostmage_benchmark)\.py)' /tmp/changed-files.txt; then
          echo "has_quality_changes=true" >> "$GITHUB_OUTPUT"
          echo "AI-quality-related changes detected:"
          cat /tmp/changed-files.txt
        else
          echo "has_quality_changes=false" >> "$GITHUB_OUTPUT"
          echo "No AI-quality-related changes detected."
        fi

        # Strength promotion is required for changes that are intended to
        # modify search/evaluation strength. Semantic terminal-contract fixes
        # are different: the production search change is a narrow correctness
        # guard whose purpose is to make an already-terminal root expose the
        # documented no-move contract. Keep the Arena diagnostic-only when,
        # and only when, the PR proves that exact bounded change.
        terminal_contract_only=false
        if grep -Fxq 'ai/cpp_engine/search.cpp' /tmp/changed-files.txt && \
           grep -Fxq 'tests/cpp_terminal_contract_test.cpp' /tmp/changed-files.txt && \
           grep -Fxq 'tests/test_terminal_contract_differential.py' /tmp/changed-files.txt && \
           grep -Fxq 'tools/scripts/build_cpp_engine.py' /tmp/changed-files.txt && \
           grep -Fxq '.github/workflows/test_suite.yml' /tmp/changed-files.txt && \
           grep -Fxq '.github/workflows/ai_quality_gate.yml' /tmp/changed-files.txt && \
           ! grep -Eq '^tools/nnue/' /tmp/changed-files.txt && \
           ! grep -Eq '^ai/cpp_engine/(evaluate|nnue)\.(cpp|h|hpp|cc|cxx)$' /tmp/changed-files.txt; then
          unexpected=false
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/ai_quality_gate.yml|.github/workflows/test_suite.yml|ai/cpp_engine/search.cpp|tests/cpp_terminal_contract_test.cpp|tests/test_terminal_contract_differential.py|tools/scripts/build_cpp_engine.py) ;;
              *) unexpected=true ;;
            esac
          done < /tmp/changed-files.txt

          search_delta="$(git diff --unified=0 "$BASE...HEAD" -- ai/cpp_engine/search.cpp | \
            grep -E '^[+-]' | grep -Ev '^(---|\+\+\+)' || true)"
          search_delta_count="$(printf '%s\n' "$search_delta" | sed '/^$/d' | wc -l | tr -d ' ')"
          expected_search_line='+    if (is_terminal_score(evaluate_board())) return "";'

          if [ "$unexpected" = false ] && \
             [ "$search_delta_count" -eq 1 ] && \
             printf '%s\n' "$search_delta" | grep -Fxq "$expected_search_line"; then
            terminal_contract_only=true
          fi
        fi

        if [ "$terminal_contract_only" = true ]; then
          echo "has_promotion_changes=false" >> "$GITHUB_OUTPUT"
          echo "A0.1 terminal contract correctness fix detected; Arena remains diagnostic only."
        elif grep -Eq '(^|/)tests/test_a0_c1_tt_observability\.py$' /tmp/changed-files.txt && \
             ! grep -Eq '^tools/nnue/' /tmp/changed-files.txt && \
             ! grep -Eq '^ai/cpp_engine/(evaluate|nnue)\.(cpp|h|hpp|cc|cxx)$' /tmp/changed-files.txt; then
          echo "has_promotion_changes=false" >> "$GITHUB_OUTPUT"
          echo "A0 C1 TT observability seam detected; Arena remains diagnostic only."
        elif grep -Eq '^(ai/cpp_engine/(evaluate|search|nnue)\.(cpp|h|hpp|cc|cxx)|tools/nnue/)' /tmp/changed-files.txt; then
          echo "has_promotion_changes=true" >> "$GITHUB_OUTPUT"
          echo "Strength-sensitive changes detected; promotion Arena required."
        else
          echo "has_promotion_changes=false" >> "$GITHUB_OUTPUT"
          echo "No direct strength-sensitive changes; Arena remains diagnostic only."
        fi

    - name: Build challenger on current PR rules
      if: steps.changes.outputs.has_quality_changes == 'true'
      shell: bash
      run: |
        set -euo pipefail
        git worktree add --detach /tmp/redwar-quality-head HEAD
        cd /tmp/redwar-quality-head
        cpp_sources=(ai/cpp_engine/board.cpp ai/cpp_engine/evaluate.cpp ai/cpp_engine/main.cpp ai/cpp_engine/movegen.cpp ai/cpp_engine/search.cpp)
        if [[ -f ai/cpp_engine/nnue.cpp ]]; then cpp_sources+=(ai/cpp_engine/nnue.cpp); fi
        g++ -std=c++17 -O3 -march=native -mtune=native -flto -DNDEBUG -pipe "${cpp_sources[@]}" -o ai/cpp_engine/engine
        chmod +x ai/cpp_engine/engine

    - name: Build main AI on current PR rules
      if: steps.changes.outputs.has_quality_changes == 'true'
      shell: bash
      run: |
        set -euo pipefail
        BASE="${{ github.event.pull_request.base.sha }}"
        git worktree add --detach /tmp/redwar-quality-base-ai HEAD
        if ! git -C /tmp/redwar-quality-base-ai restore --source="$BASE" -- ai; then
          echo "Could not overlay main AI onto current PR rules."
          exit 1
        fi
        cd /tmp/redwar-quality-base-ai
        cpp_sources=(ai/cpp_engine/board.cpp ai/cpp_engine/evaluate.cpp ai/cpp_engine/main.cpp ai/cpp_engine/movegen.cpp ai/cpp_engine/search.cpp)
        if [[ -f ai/cpp_engine/nnue.cpp ]]; then cpp_sources+=(ai/cpp_engine/nnue.cpp); fi
        g++ -std=c++17 -O3 -march=native -mtune=native -flto -DNDEBUG -pipe "${cpp_sources[@]}" -o ai/cpp_engine/engine
        chmod +x ai/cpp_engine/engine

    - name: Benchmark main AI and challenger
      if: steps.changes.outputs.has_quality_changes == 'true'
      shell: bash
      run: |
        set -euo pipefail
        python tools/analytics/benchmark_engine.py --engine /tmp/redwar-quality-base-ai/ai/cpp_engine/engine | tee /tmp/main-ai-benchmark.txt
        python tools/analytics/benchmark_engine.py --engine /tmp/redwar-quality-head/ai/cpp_engine/engine | tee /tmp/head-benchmark.txt

    - name: Run FrostMage tactical regression
      if: steps.changes.outputs.has_quality_changes == 'true'
      shell: bash
      run: |
        set -euo pipefail
        python tools/analytics/frostmage_benchmark.py \
          --engine /tmp/redwar-quality-head/ai/cpp_engine/engine \
          --nodes 100 \
          --nodes 1000 \
          | tee /tmp/frostmage-quality.txt

    - name: Run promotion Arena
      if: steps.changes.outputs.has_promotion_changes == 'true'
      shell: bash
      run: |
        set -euo pipefail
        python /tmp/redwar-quality-head/tools/analytics/arena_tournament.py \
          --challenger-engine /tmp/redwar-quality-head/ai/cpp_engine/engine \
          --baseline-engine /tmp/redwar-quality-base-ai/ai/cpp_engine/engine \
          --jogos 100 \
          --margem-vitorias 10 \
          --nodes 10000 \
          --results /tmp/ai-quality-games.jsonl \
          | tee /tmp/ai-quality-arena.txt

    - name: Record semantic Arena diagnostic
      if: steps.changes.outputs.has_ai_changes == 'true' && steps.changes.outputs.has_promotion_changes != 'true'
      shell: bash
      run: |
        set -euo pipefail
        echo "Semantic/legality/observability AI change: no strength-promotion claim is made." | tee /tmp/ai-quality-arena.txt
        echo "The Arena result for this class of PR is diagnostic evidence only." | tee -a /tmp/ai-quality-arena.txt

    - name: Upload AI quality evidence
      if: always() && steps.changes.outputs.has_quality_changes == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: redwar-ai-quality-${{ github.event.pull_request.number }}
        path: |
          /tmp/changed-files.txt
          /tmp/main-ai-benchmark.txt
          /tmp/head-benchmark.txt
          /tmp/frostmage-quality.txt
          /tmp/ai-quality-arena.txt
          /tmp/ai-quality-games.jsonl
          /tmp/ai-quality-games.jsonl.summary.json
        if-no-files-found: warn
        retention-days: 30

    - name: Cleanup worktrees
      if: always()
      run: |
        git worktree remove --force /tmp/redwar-quality-base-ai 2>/dev/null || true
        git worktree remove --force /tmp/redwar-quality-head 2>/dev/null || true
