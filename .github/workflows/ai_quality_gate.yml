name: RedWar AI Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: redwar-ai-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'

jobs:
  ai-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - name: Checkout PR history
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Fetch PR base
      run: git fetch origin "${{ github.event.pull_request.base.ref || 'main' }}" --no-tags

    - name: Detect AI and quality changes
      id: changes
      shell: bash
      run: |
        set -euo pipefail
        BASE="${{ github.event.pull_request.base.sha }}"
        git diff --name-only "$BASE...HEAD" > /tmp/changed-files.txt

        if grep -Eq '^(ai/.*\.(py|pyx|pyi|cpp|hpp|h|c|cc|cxx)$|tools/nnue/)' /tmp/changed-files.txt; then
          echo "has_ai_changes=true" >> "$GITHUB_OUTPUT"
          echo "AI engine/NNUE changes detected."
        else
          echo "has_ai_changes=false" >> "$GITHUB_OUTPUT"
          echo "No AI engine/NNUE changes detected."
        fi

        if grep -Eq '^(ai/.*\.(py|pyx|pyi|cpp|hpp|h|c|cc|cxx)$|tools/nnue/|tools/analytics/(benchmark_engine|arena_tournament|frostmage_benchmark|promotion_arena|promotion_gate|move_ordering_baseline|compare_search_baseline|tactical_benchmark_suite)\.py|tests/(cpp_nnue_test|test_frostmage_benchmark|test_sprint20_tactical_benchmark_suite|test_move_ordering_baseline|test_compare_search_baseline)\.py)' /tmp/changed-files.txt; then
          echo "has_quality_changes=true" >> "$GITHUB_OUTPUT"
          echo "AI-quality-related changes detected:"
          cat /tmp/changed-files.txt
        else
          echo "has_quality_changes=false" >> "$GITHUB_OUTPUT"
          echo "No AI-quality-related changes detected."
        fi

        terminal_contract_only=false
        search_numstat="$(git diff --numstat "$BASE...HEAD" -- ai/cpp_engine/search.cpp)"
        search_added="${search_numstat%%$'\t'*}"
        search_deleted="${search_numstat#*$'\t'}"
        search_deleted="${search_deleted%%$'\t'*}"
        search_path="${search_numstat##*$'\t'}"

        expected_files=6
        actual_files="$(wc -l < /tmp/changed-files.txt | tr -d ' ')"
        if [ "$actual_files" -eq "$expected_files" ] && \
           [ "$search_added" = "2" ] && [ "$search_deleted" = "0" ] && \
           [ "$search_path" = "ai/cpp_engine/search.cpp" ] && \
           ! grep -Eq '^tools/nnue/' /tmp/changed-files.txt && \
           ! grep -Eq '^ai/cpp_engine/(evaluate|nnue)\.(cpp|h|hpp|cc|cxx)$' /tmp/changed-files.txt; then
          terminal_contract_only=true
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/ai_quality_gate.yml|.github/workflows/test_suite.yml|ai/cpp_engine/search.cpp|tests/cpp_terminal_contract_test.cpp|tests/test_terminal_contract_differential.py|tools/scripts/build_cpp_engine.py) ;;
              *) terminal_contract_only=false ;
            esac
          done < /tmp/changed-files.txt

          search_guard_count="$(git diff --unified=0 "$BASE...HEAD" -- ai/cpp_engine/search.cpp | grep -F -c 'is_terminal_score(evaluate_board())')"
          if [ "$search_guard_count" -ne 1 ]; then
            terminal_contract_only=false
          fi
        fi

        dataset_methodology_only=false
        if [ "$actual_files" -eq 4 ]; then
          dataset_methodology_only=true
          while IFS= read -r path; do
            case "$path" in
              docs/RESEARCH_ENGINEERING_2026-09-08.md|tests/test_nnue_dataset_tools.py|tools/nnue/audit_dataset.py|tools/nnue/train.py) ;;
              *) dataset_methodology_only=false ;
            esac
          done < /tmp/changed-files.txt
        fi

        nnue_training_process_only=false
        if [ "$actual_files" -ge 1 ]; then
          nnue_training_process_only=true
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/ai_quality_gate.yml|.github/workflows/nnue_nightly.yml|tools/nnue/train.py) ;;
              *) nnue_training_process_only=false ;
            esac
          done < /tmp/changed-files.txt
        fi

        teacher_pipeline_only=false
        if [ "$actual_files" -ge 1 ]; then
          teacher_pipeline_only=true
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/ai_quality_gate.yml|.github/workflows/nnue_nightly.yml|tools/nnue/generate_teacher.py|tools/nnue/train.py|tests/test_nnue_teacher_rwen_contract.py) ;;
              *) teacher_pipeline_only=false ;
            esac
          done < /tmp/changed-files.txt
        fi

        if [ "$terminal_contract_only" = true ]; then
          echo "has_promotion_changes=false" >> "$GITHUB_OUTPUT"
          echo "A0.1 terminal contract correctness fix detected; Arena remains diagnostic only."
        elif [ "$dataset_methodology_only" = true ]; then
          echo "has_promotion_changes=false" >> "$GITHUB_OUTPUT"
          echo "NNUE dataset-methodology validation change detected; no strength-promotion claim is made."
        elif [ "$nnue_training_process_only" = true ]; then
          echo "has_promotion_changes=false" >> "$GITHUB_OUTPUT"
          echo "NNUE training-process maintenance change detected; Arena remains diagnostic only."
        elif [ "$teacher_pipeline_only" = true ]; then
          echo "has_promotion_changes=false" >> "$GITHUB_OUTPUT"
          echo "NNUE teacher-pipeline correctness change detected; Arena remains diagnostic only."
        elif grep -Eq '(^|/)tests/test_a0_c1_tt_observability\.py$' /tmp/changed-files.txt && \
             ! grep -Eq '^tools/nnue/' /tmp/changed-files.txt && \
             ! grep -Eq '^ai/cpp_engine/(evaluate|nnue)\.(cpp|h|hpp|cc|cxx)$' /tmp/changed-files.txt; then
          echo "has_promotion_changes=false" >> "$GITHUB_OUTPUT"
          echo "A0 C1 TT observability seam detected; Arena remains diagnostic only."
        elif grep -Eq '^(ai/cpp_engine/(evaluate|search|nnue)\.(cpp|h|hpp|cc|cxx)|tools/nnue/)' /tmp/changed-files.txt; then
          echo "has_promotion_changes=true" >> "$GITHUB_OUTPUT"
          echo "Strength-sensitive changes detected; authoritative promotion Arena required."
        else
          echo "has_promotion_changes=false" >> "$GITHUB_OUTPUT"
          echo "No direct strength-sensitive changes; Arena remains diagnostic only."
        fi

    - name: Build challenger on current PR rules
      if: steps.changes.outputs.has_quality_changes == 'true'
      shell: bash
      run: |
        set -euo pipefail
        git worktree add --detach /tmp/redwar-quality-head HEAD
        cd /tmp/redwar-quality-head
        cpp_sources=(ai/cpp_engine/board.cpp ai/cpp_engine/evaluate.cpp ai/cpp_engine/main.cpp ai/cpp_engine/movegen.cpp ai/cpp_engine/search.cpp)
        if [[ -f ai/cpp_engine/nnue.cpp ]]; then cpp_sources+=(ai/cpp_engine/nnue.cpp); fi
        g++ -std=c++17 -O3 -march=native -mtune=native -flto -DNDEBUG -pipe "${cpp_sources[@]}" -o ai/cpp_engine/engine
        chmod +x ai/cpp_engine/engine

    - name: Build main AI on current PR rules
      if: steps.changes.outputs.has_quality_changes == 'true'
      shell: bash
      run: |
        set -euo pipefail
        BASE="${{ github.event.pull_request.base.sha }}"
        git worktree add --detach /tmp/redwar-quality-base-ai HEAD
        if ! git -C /tmp/redwar-quality-base-ai restore --source="$BASE" -- ai; then
          echo "Could not overlay main AI onto current PR rules."
          exit 1
        fi
        cd /tmp/redwar-quality-base-ai
        cpp_sources=(ai/cpp_engine/board.cpp ai/cpp_engine/evaluate.cpp ai/cpp_engine/main.cpp ai/cpp_engine/movegen.cpp ai/cpp_engine/search.cpp)
        if [[ -f ai/cpp_engine/nnue.cpp ]]; then cpp_sources+=(ai/cpp_engine/nnue.cpp); fi
        g++ -std=c++17 -O3 -march=native -mtune=native -flto -DNDEBUG -pipe "${cpp_sources[@]}" -o ai/cpp_engine/engine
        chmod +x ai/cpp_engine/engine

    - name: Benchmark main AI and challenger
      if: steps.changes.outputs.has_quality_changes == 'true'
      shell: bash
      run: |
        set -euo pipefail
        python tools/analytics/benchmark_engine.py --engine /tmp/redwar-quality-base-ai/ai/cpp_engine/engine | tee /tmp/main-ai-benchmark.txt
        python tools/analytics/benchmark_engine.py --engine /tmp/redwar-quality-head/ai/cpp_engine/engine | tee /tmp/head-benchmark.txt

    - name: Run protected tactical suite
      if: steps.changes.outputs.has_promotion_changes == 'true'
      shell: bash
      run: |
        set -euo pipefail
        python tools/analytics/tactical_benchmark_suite.py \
          --engine /tmp/redwar-quality-head/ai/cpp_engine/engine \
          --nodes 10 \
          --nodes 100 \
          --nodes 1000 \
          | tee /tmp/protected-tactical-suite.txt

    - name: Run FrostMage tactical regression
      if: steps.changes.outputs.has_quality_changes == 'true'
      shell: bash
      run: |
        set -euo pipefail
        python tools/analytics/frostmage_benchmark.py \
          --engine /tmp/redwar-quality-head/ai/cpp_engine/engine \
          --nodes 100 \
          --nodes 1000 \
          | tee /tmp/frostmage-quality.txt

    - name: Compare deterministic search baseline
      if: steps.changes.outputs.has_promotion_changes == 'true'
      shell: bash
      run: |
        set -euo pipefail
        (
          cd /tmp/redwar-quality-base-ai
          python tools/analytics/move_ordering_baseline.py \
            --all-cases \
            --nodes 10 25 50 75 100 150 200 300 500 1000 \
            --output /tmp/search-baseline-reference.json
        )
        (
          cd /tmp/redwar-quality-head
          python tools/analytics/move_ordering_baseline.py \
            --all-cases \
            --nodes 10 25 50 75 100 150 200 300 500 1000 \
            --output /tmp/search-baseline-candidate.json
        )
        python tools/analytics/compare_search_baseline.py \
          /tmp/search-baseline-reference.json \
          /tmp/search-baseline-candidate.json \
          | tee /tmp/search-baseline-comparison.txt

    - name: Run authoritative promotion Arena
      if: steps.changes.outputs.has_promotion_changes == 'true'
      shell: bash
      run: |
        set -euo pipefail
        BASE="${{ github.event.pull_request.base.sha }}"
        RULES_VERSION="${{ github.sha }}"
        PROMOTION_DIR=/tmp/authoritative-promotion
        mkdir -p "$PROMOTION_DIR"
        result_files=()
        final_decision=continue

        for stage in 96 192 320 512; do
          result_file="$PROMOTION_DIR/stage-${stage}.jsonl"
          summary_file="$PROMOTION_DIR/gate-${stage}.json"

          python tools/analytics/promotion_arena.py \
            --challenger-engine /tmp/redwar-quality-head/ai/cpp_engine/engine \
            --baseline-engine /tmp/redwar-quality-base-ai/ai/cpp_engine/engine \
            --stage-games "$stage" \
            --nodes 10000 \
            --results "$result_file" \
            --challenger-version "$RULES_VERSION" \
            --baseline-version "$BASE" \
            --rules-version "$RULES_VERSION"

          result_files+=(--results "$result_file")
          set +e
          python tools/analytics/promotion_gate.py \
            "${result_files[@]}" \
            --bootstrap-replicates 2000 \
            --bootstrap-seed 0 \
            --summary-output "$summary_file" \
            | tee "/tmp/promotion-gate-${stage}.txt"
          gate_status=${PIPESTATUS[0]}
          set -e

          final_decision="$(python - "$summary_file" <<'PY'
import json
import sys
print(json.loads(open(sys.argv[1], encoding="utf-8").read())["decision"])
PY
)"

          echo "authoritative_gate stage=${stage} decision=${final_decision} exit=${gate_status}"
          if [ "$final_decision" = "accept" ]; then
            break
          fi
          if [ "$final_decision" = "reject" ]; then
            echo "Authoritative promotion gate rejected the challenger at ${stage} games."
            exit 1
          fi
        done

        if [ "$final_decision" = "continue" ]; then
          echo "Authoritative promotion gate did not reach a terminal decision."
          exit 1
        fi

    - name: Record semantic Arena diagnostic
      if: steps.changes.outputs.has_ai_changes == 'true' && steps.changes.outputs.has_promotion_changes != 'true'
      shell: bash
      run: |
        set -euo pipefail
        echo "Semantic/legality/observability AI change: no strength-promotion claim is made." | tee /tmp/ai-quality-arena.txt
        echo "The Arena result for this class of PR is diagnostic evidence only." | tee -a /tmp/ai-quality-arena.txt

    - name: Upload AI quality evidence
      if: always() && steps.changes.outputs.has_quality_changes == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: redwar-ai-quality-${{ github.event.pull_request.number }}
        path: |
          /tmp/changed-files.txt
          /tmp/main-ai-benchmark.txt
          /tmp/head-benchmark.txt
          /tmp/protected-tactical-suite.txt
          /tmp/frostmage-quality.txt
          /tmp/search-baseline-reference.json
          /tmp/search-baseline-candidate.json
          /tmp/search-baseline-comparison.txt
          /tmp/authoritative-promotion/stage-*.jsonl
          /tmp/authoritative-promotion/gate-*.json
          /tmp/promotion-gate-*.txt
          /tmp/ai-quality-arena.txt
        if-no-files-found: warn
        retention-days: 30

    - name: Cleanup worktrees
      if: always()
      run: |
        git worktree remove --force /tmp/redwar-quality-base-ai 2>/dev/null || true
        git worktree remove --force /tmp/redwar-quality-head 2>/dev/null || true
