name: RedWar Auto-Balancer & ELO Calibration

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: redwar-auto-balancer
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONHASHSEED: '0'

jobs:
  auto-balance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build C++ Teacher/Trainer Engine
        run: |
          cd ai/cpp_engine
          g++ -std=c++17 -O3 -DNDEBUG -pipe \
            board.cpp evaluate.cpp main.cpp movegen.cpp nnue.cpp search.cpp \
            -o engine
      - name: Generate Telemetry (Trainer)
        run: |
          python tools/analytics/trainer.py \
            --seed 20260824 \
            --output data/estatisticas_treino.json \
            --bot-timeout 10
      - name: Run Auto-Pricer Without Writing Game Configuration
        run: |
          python tools/balance/auto_pricer.py \
            --no-write \
            --report /tmp/auto_balance_report.json
      - name: Upload Auto-Balance Report
        uses: actions/upload-artifact@v7
        with:
          name: redwar-auto-balance-report-${{ github.run_id }}
          path: /tmp/auto_balance_report.json
          if-no-files-found: error
      - name: Upload Training Telemetry and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: redwar-training-telemetry-${{ github.run_id }}
          path: |
            data/estatisticas_treino.json
            logs/trainer_failures/**
          if-no-files-found: warn
