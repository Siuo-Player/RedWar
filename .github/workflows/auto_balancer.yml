name: RedWar Auto-Balancer & ELO Calibration

on:
  workflow_dispatch: # Permite-te clicar num botão no GitHub para rodar manualmente
  schedule:
    - cron: '0 3 * * *' # Roda automaticamente todos os dias às 3 da manhã (UTC)

permissions:
  contents: write # Dá permissão ao bot para alterar os ficheiros e fazer push

jobs:
  nightly-calibration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v3

      - name: Instalar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 1. Treino e Extração de Estatísticas
        run: |
          python ai/trainer.py
          python ai/game_analyzer.py

      - name: 2. Calibração da Matemática do ELO (Versão Rápida Cloud)
        run: |
          python ai/calibrate_elo_chain.py --jogos 50

      # Se quisermos que um script Python atualize o mobs_config.json baseado nas vitórias, ele correria aqui.
      
      - name: Commit e Push das Modificações
        run: |
          git config --global user.name "RedWar Auto-Balancer Bot"
          git config --global user.email "actions@github.com"
          
          # Adiciona todos os ficheiros JSON gerados ou modificados pelos scripts
          git add *.json
          git add ai/*.json
          
          # Faz commit apenas se houver mudanças reais
          git commit -m "🤖 Auto-Balance: Telemetria, Custos e ELO recalibrados automaticamente" || echo "Sem alterações para gravar"
          git push