name: RedWar Auto-Balancer & ELO Calibration

on:
  push:
    branches:
      - main  # Dispara sempre que fizeres push para a branch principal
  workflow_dispatch: # Mantém o botão manual disponível na web

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true # Cancela automaticamente os runs anteriores pendentes/em execução

jobs:
  nightly-calibration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v3

      - name: Instalar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 1. Treino e Extração de Estatísticas
        run: |
          python ai/trainer.py
          python ai/game_analyzer.py

      - name: 2. Calibração da Matemática do ELO
        run: |
          python ai/calibrate_elo_chain.py --jogos 50

      - name: Commit e Push das Modificações
        run: |
          git config --global user.name "RedWar Auto-Balancer Bot"
          git config --global user.email "actions@github.com"
          
          git add *.json
          git add ai/*.json
          
          git commit -m "🤖 Auto-Balance: Telemetria e ELO atualizados para o commit mais recente" || echo "Sem alterações para gravar"
          git push