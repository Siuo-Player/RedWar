name: RedWar Auto-Balancer & ELO Calibration

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  auto-balance:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build Cython Evaluator
      run: python setup.py build_ext --inplace

    - name: Build C++ Engine (Linux)
      run: |
        cd ai/cpp_engine
        g++ -std=c++17 -O3 engine.cpp -o engine
        chmod +x engine

    - name: Generate Telemetry (Trainer)
      run: python tools/analytics/trainer.py

    - name: Run Auto-Pricer
      run: python tools/balance/auto_pricer.py
      
    - name: Commit and Push Balance Changes
      run: |
        git config --local user.name "github-actions[bot]"
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git add engine/heroes_config.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "chore(balance): atualizacao automatica de custos pelo ELO" && git push)