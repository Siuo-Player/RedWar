name: RedWar Auto-Balancer & ELO Calibration

on:
  pull_request:
    paths:
      - 'ai/**'
      - 'engine/heroes_config.json'
      - 'tools/balance/**'
      - 'tools/analytics/trainer.py'
      - 'tools/nnue/**'
      - 'tests/test_auto_pricer.py'
      - 'tests/test_trainer.py'
      - 'tests/test_nnue_features.py'
      - 'tests/cpp_reversibility_test.cpp'
      - 'tests/cpp_nnue_test.cpp'
      - 'tests/test_moves.py'
      - 'tests/test_rules.py'
      - '.github/workflows/auto_balancer.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-balance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Build Cython Evaluator
      run: python setup.py build_ext --inplace
    - name: Build C++ Engine (Linux)
      run: |
        cd ai/cpp_engine
        cpp_sources=(board.cpp evaluate.cpp main.cpp movegen.cpp search.cpp)
        if [[ -f nnue.cpp ]]; then cpp_sources+=(nnue.cpp); fi
        g++ -std=c++17 -O3 -march=native -mtune=native -flto -DNDEBUG -pipe "${cpp_sources[@]}" -o engine
        chmod +x engine
    - name: Test C++ make/unmake Reversibility
      run: |
        cpp_sources=(ai/cpp_engine/board.cpp ai/cpp_engine/evaluate.cpp ai/cpp_engine/movegen.cpp ai/cpp_engine/search.cpp)
        if [[ -f ai/cpp_engine/nnue.cpp ]]; then cpp_sources+=(ai/cpp_engine/nnue.cpp); fi
        g++ -std=c++17 -O2 -pipe "${cpp_sources[@]}" tests/cpp_reversibility_test.cpp -o cpp_reversibility_test
        ./cpp_reversibility_test
    - name: Test C++ Evaluation Smoke Tests
      run: |
        cpp_sources=(ai/cpp_engine/board.cpp ai/cpp_engine/evaluate.cpp ai/cpp_engine/movegen.cpp ai/cpp_engine/search.cpp)
        if [[ -f ai/cpp_engine/nnue.cpp ]]; then cpp_sources+=(ai/cpp_engine/nnue.cpp); fi
        g++ -std=c++17 -O2 -pipe "${cpp_sources[@]}" ai/cpp_engine/SmokeTest.cpp -o cpp_smoke_test
        ./cpp_smoke_test
    - name: Test Python NNUE Feature Layout
      run: pytest -q tests/test_nnue_features.py
    - name: Test C++ NNUE Integration
      run: |
        python -m tools.nnue.bootstrap_model --output /tmp/ares-bootstrap.nnue
        g++ -std=c++17 -O2 -pipe ai/cpp_engine/board.cpp ai/cpp_engine/evaluate.cpp ai/cpp_engine/movegen.cpp ai/cpp_engine/nnue.cpp ai/cpp_engine/search.cpp tests/cpp_nnue_test.cpp -o cpp_nnue_test
        REDWAR_NNUE_MODEL=/tmp/ares-bootstrap.nnue ./cpp_nnue_test
    - name: Test Auto-Pricer Overflow Regression
      run: pytest -q tests/test_auto_pricer.py
    - name: Test Trainer and Rules Regression
      run: pytest -q tests/test_trainer.py tests/test_rules.py tests/test_moves.py
    - name: Generate Telemetry (Trainer)
      run: python tools/analytics/trainer.py
    - name: Run Auto-Pricer
      run: python tools/balance/auto_pricer.py --no-write --report data/auto_balance_report.json
    - name: Upload Auto-Balance Report
      uses: actions/upload-artifact@v4
      with:
        name: redwar-auto-balance-report-${{ github.event.pull_request.number }}
        path: data/auto_balance_report.json
        if-no-files-found: error
