name: RedWar Auto-Balancer & ELO Calibration

on:
  pull_request:
    paths:
      - 'ai/**'
      - 'engine/heroes_config.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-balance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Build Cython Evaluator
      run: python setup.py build_ext --inplace
    - name: Build C++ Engine (Linux)
      run: |
        cd ai/cpp_engine
        g++ -std=c++17 -O3 -march=native -mtune=native -flto -DNDEBUG -pipe board.cpp evaluate.cpp main.cpp movegen.cpp search.cpp -o engine
        chmod +x engine
    - name: Generate Telemetry (Trainer)
      run: python tools/analytics/trainer.py
    - name: Run Auto-Pricer
      run: python tools/balance/auto_pricer.py
