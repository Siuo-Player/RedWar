name: RedWar Auto-Balancer & ELO Calibration

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: redwar-auto-balancer
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONHASHSEED: '0'

jobs:
  overflow-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Python numeric regressions
        run: pytest -q tests/test_auto_pricer.py
      - name: Run C++ numeric evaluation regression
        run: |
          g++ -std=c++17 -O2 -pipe \
            ai/cpp_engine/board.cpp \
            ai/cpp_engine/evaluate.cpp \
            ai/cpp_engine/movegen.cpp \
            ai/cpp_engine/search.cpp \
            ai/cpp_engine/nnue.cpp \
            tests/cpp_numeric_bounds_test.cpp \
            -o cpp_numeric_bounds_test
          ./cpp_numeric_bounds_test

  auto-balance:
    needs: overflow-regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build C++ Teacher/Trainer Engine
        run: |
          cd ai/cpp_engine
          g++ -std=c++17 -O3 -DNDEBUG -pipe \
            board.cpp evaluate.cpp main.cpp movegen.cpp nnue.cpp search.cpp \
            -o engine
          chmod +x engine
      - name: Test Trainer and Rules Regression
        run: pytest -q tests/test_trainer.py tests/test_rules.py tests/test_moves.py
      - name: Generate Telemetry (Trainer)
        run: |
          python tools/analytics/trainer.py \
            --seed 20260823 \
            --output /tmp/estatisticas_treino.json
      - name: Run Auto-Pricer Without Writing Game Configuration
        run: |
          python tools/balance/auto_pricer.py \
            --no-write \
            --report /tmp/auto_balance_report.json
      - name: Upload Auto-Balance Report
        uses: actions/upload-artifact@v4
        with:
          name: redwar-auto-balance-report-${{ github.run_id }}
          path: /tmp/auto_balance_report.json
          if-no-files-found: error
      - name: Upload Training Telemetry
        uses: actions/upload-artifact@v4
        with:
          name: redwar-training-telemetry-${{ github.run_id }}
          path: /tmp/estatisticas_treino.json
          if-no-files-found: error
