name: RedWar Auto-Balancer & ELO Calibration

on:
  pull_request:
    paths:
      - 'ai/**'
      - 'engine/heroes_config.json'
      - 'tools/balance/**'
      - 'tools/analytics/trainer.py'
      - 'tests/test_auto_pricer.py'
      - 'tests/test_trainer.py'
      - '.github/workflows/auto_balancer.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-balance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Build Cython Evaluator
      run: python setup.py build_ext --inplace
    - name: Build C++ Engine (Linux)
      run: |
        cd ai/cpp_engine
        g++ -std=c++17 -O3 -march=native -mtune=native -flto -DNDEBUG -pipe board.cpp evaluate.cpp main.cpp movegen.cpp search.cpp -o engine
        chmod +x engine
    - name: Test Auto-Pricer Overflow Regression
      run: pytest -q tests/test_auto_pricer.py
    - name: Test Trainer and Rules Regression
      run: pytest -q tests/test_trainer.py tests/test_rules.py tests/test_moves.py
    - name: Generate Telemetry (Trainer)
      run: python tools/analytics/trainer.py
    - name: Run Auto-Pricer
      run: python tools/balance/auto_pricer.py --no-write --report data/auto_balance_report.json
    - name: Upload Auto-Balance Report
      uses: actions/upload-artifact@v4
      with:
        name: redwar-auto-balance-report-${{ github.event.pull_request.number }}
        path: data/auto_balance_report.json
        if-no-files-found: error
