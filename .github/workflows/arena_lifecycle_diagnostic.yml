name: RedWar Arena Lifecycle Diagnostic

on:
  workflow_dispatch:
    inputs:
      games:
        description: 'Even number of paired games for each lifecycle mode'
        required: false
        default: '32'
        type: string
      nodes:
        description: 'Matched Ares node budget per move'
        required: false
        default: '10000'
        type: string

permissions:
  contents: read

jobs:
  lifecycle-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: '0'
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Ares engine
        run: |
          python tools/scripts/build_cpp_engine.py
          chmod +x ai/cpp_engine/engine

      - name: Validate diagnostic inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.games }}" =~ ^[0-9]+$ ]] || { echo 'games must be an integer'; exit 1; }
          (( 10#${{ inputs.games }} > 0 )) || { echo 'games must be positive'; exit 1; }
          (( 10#${{ inputs.games }} % 2 == 0 )) || { echo 'games must be even'; exit 1; }
          [[ "${{ inputs.nodes }}" =~ ^[0-9]+$ ]] || { echo 'nodes must be an integer'; exit 1; }
          (( 10#${{ inputs.nodes }} > 0 )) || { echo 'nodes must be positive'; exit 1; }

      - name: Run persistent-vs-fresh lifecycle diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/arena/lifecycle
          python tools/analytics/arena_lifecycle_diagnostic.py \
            --challenger-engine "$GITHUB_WORKSPACE/ai/cpp_engine/engine" \
            --baseline-engine "$GITHUB_WORKSPACE/ai/cpp_engine/engine" \
            --nodes "${{ inputs.nodes }}" \
            --games "${{ inputs.games }}" \
            --output data/arena/lifecycle/lifecycle-diagnostic-${{ github.run_id }}.json

      - name: Upload lifecycle evidence
        uses: actions/upload-artifact@v4
        with:
          name: redwar-arena-lifecycle-diagnostic-${{ github.run_id }}
          path: data/arena/lifecycle/lifecycle-diagnostic-${{ github.run_id }}.json
          if-no-files-found: error
