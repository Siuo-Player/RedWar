name: RedWar NNUE Nightly Training

on:
  # Deliberately NOT triggered by push/pull_request: a series of commits must
  # never create a series of overlapping two-hour training jobs.
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

concurrency:
  # One training job may run at a time. If several newer runs are queued while
  # one is running, GitHub keeps at most one pending run for this group; the
  # newest pending run supersedes older pending runs. The active run is never
  # cancelled, so a two-hour training session is not wasted by a new commit.
  group: redwar-nnue-nightly-training
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONHASHSEED: '0'

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Record training revision
        run: |
          echo "MAIN_SHA=$(git rev-parse HEAD)" | tee training-revision.txt
          git status --short

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install base dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build C++ teacher engine
        run: |
          cd ai/cpp_engine
          g++ -std=c++17 -O3 -DNDEBUG -pipe \
            board.cpp evaluate.cpp main.cpp movegen.cpp nnue.cpp search.cpp \
            -o engine
          chmod +x engine

      - name: Generate teacher dataset from this main revision
        run: |
          python tools/nnue/generate_teacher.py \
            --engine ai/cpp_engine/engine \
            --output /tmp/teacher.jsonl

      - name: Install PyTorch CPU trainer
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Train for this exact main revision
        # Fresh per SHA on purpose: if the rules/evaluation change, the next
        # nightly run must not resume weights trained against the old game.
        # Stop before the GitHub 120-minute timeout so the model is exported
        # and uploaded normally. The 120-minute job timeout is a final failsafe.
        run: |
          python tools/nnue/train.py \
            /tmp/teacher.jsonl \
            --output /tmp/ares-nightly-${GITHUB_SHA}.nnue \
            --epochs 1000000 \
            --batch-size 128 \
            --seed 20260823 \
            --max-seconds 6900

      - name: Store model and metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: redwar-nnue-nightly-${{ github.sha }}
          path: |
            /tmp/ares-nightly-${{ github.sha }}.nnue
            /tmp/teacher.jsonl
            training-revision.txt
          if-no-files-found: warn
          retention-days: 14
