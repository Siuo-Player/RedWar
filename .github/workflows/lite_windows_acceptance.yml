name: RedWar Lite Windows Acceptance

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "main.py"
      - "engine/**"
      - "ui/**"
      - "tools/replay/**"
      - "tools/acceptance/**"
      - "run_redwar.bat"
      - "requirements.txt"
      - ".github/workflows/lite_windows_acceptance.yml"
  push:
    branches: [main]
    paths:
      - "main.py"
      - "engine/**"
      - "ui/**"
      - "tools/replay/**"
      - "tools/acceptance/**"
      - "run_redwar.bat"
      - "requirements.txt"
      - ".github/workflows/lite_windows_acceptance.yml"
  workflow_dispatch:

concurrency:
  group: redwar-lite-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-blackbox-acceptance:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
      PYTHONHASHSEED: "0"
      SDL_VIDEO_WINDOW_POS: "40,40"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install acceptance screenshot dependency
        run: python -m pip install --upgrade Pillow

      - name: Run real Windows SDL black-box acceptance
        run: python tools/acceptance/lite_windows_e2e.py

      - name: Upload black-box evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: redwar-lite-windows-acceptance-${{ github.run_id }}
          path: artifacts/lite-windows-acceptance/
          if-no-files-found: warn
          retention-days: 30
