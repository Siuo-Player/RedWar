name: RedWar Strength Calibration Controls

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Predeclared calibration run_id from 2026-08-29 protocol-v3 plan'
        required: false
        default: 'aa-baseline-a-v1'
        type: string
      games:
        description: 'Even number of paired games; explicit because the plan does not encode a default'
        required: true
        default: '100'
        type: string
      selection_policy:
        description: 'Declared controller-selection policy'
        required: true
        default: 'aa-calibration-v3-fixed-context'
        type: string
      controller_population:
        description: 'Declared controller population'
        required: true
        default: 'same-engine-aa-v1'
        type: string
      skill_context:
        description: 'Declared strength context'
        required: true
        default: 'fixed-node-budget-250k'
        type: string
  push:
    branches:
      - 'calibration/strength/**'
      - 'ci/plan-backed-strength-calibration-2026-08-27'

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  CALIBRATION_PLAN: 'data/arena/strength/plans/2026-08-29-aa-calibration-v1.json'
  CALIBRATION_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.run_id || 'aa-baseline-a-v1' }}
  CALIBRATION_GAMES: ${{ github.event_name == 'workflow_dispatch' && inputs.games || '100' }}
  CALIBRATION_SELECTION_POLICY: ${{ github.event_name == 'workflow_dispatch' && inputs.selection_policy || 'aa-calibration-v3-fixed-context' }}
  CALIBRATION_CONTROLLER_POPULATION: ${{ github.event_name == 'workflow_dispatch' && inputs.controller_population || 'same-engine-aa-v1' }}
  CALIBRATION_SKILL_CONTEXT: ${{ github.event_name == 'workflow_dispatch' && inputs.skill_context || 'fixed-node-budget-250k' }}

jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve frozen calibration engine
        shell: bash
        run: |
          set -euo pipefail
          FROZEN_SHA=$(python - <<'PY'
          import json
          import os
          from pathlib import Path
          plan = json.loads(Path(os.environ['CALIBRATION_PLAN']).read_text(encoding='utf-8'))
          run_id = os.environ['CALIBRATION_RUN_ID']
          run = next(item for item in plan['runs'] if item['run_id'] == run_id)
          if not run.get('execution_ready', False) or run['role'] != 'calibration':
              raise SystemExit(f'run {run_id} is not an execution-ready calibration run')
          if run['challenger_version'] != run['baseline_version']:
              raise SystemExit('calibration controls require identical challenger/baseline revisions')
          print(run['challenger_version'])
          PY
          )
          echo "FROZEN_SHA=$FROZEN_SHA" >> "$GITHUB_ENV"
          git fetch origin "$FROZEN_SHA" --no-tags
          git worktree add --detach /tmp/redwar-frozen "$FROZEN_SHA"
          pushd /tmp/redwar-frozen/ai/cpp_engine >/dev/null
          cpp_sources=(board.cpp evaluate.cpp main.cpp movegen.cpp search.cpp)
          if [[ -f nnue.cpp ]]; then cpp_sources+=(nnue.cpp); fi
          g++ -std=c++17 -O3 -march=native -mtune=native -flto -DNDEBUG -pipe "${cpp_sources[@]}" -o engine
          chmod +x engine
          popd >/dev/null

      - name: Execute predeclared calibration run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/redwar-calibration
          python tools/analytics/strength_calibration_runner.py \
            "$CALIBRATION_PLAN" \
            --run-id "$CALIBRATION_RUN_ID" \
            --challenger-engine /tmp/redwar-frozen/ai/cpp_engine/engine \
            --baseline-engine /tmp/redwar-frozen/ai/cpp_engine/engine \
            --games "$CALIBRATION_GAMES" \
            --selection-policy "$CALIBRATION_SELECTION_POLICY" \
            --controller-population "$CALIBRATION_CONTROLLER_POPULATION" \
            --skill-context "$CALIBRATION_SKILL_CONTEXT" \
            --results "/tmp/redwar-calibration/$CALIBRATION_RUN_ID-games.jsonl" \
            --dataset "/tmp/redwar-calibration/$CALIBRATION_RUN_ID-dataset.json"

      - name: Validate generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          RESULTS="/tmp/redwar-calibration/$CALIBRATION_RUN_ID-games.jsonl"
          DATASET="/tmp/redwar-calibration/$CALIBRATION_RUN_ID-dataset.json"
          python - "$RESULTS" "$CALIBRATION_GAMES" "$FROZEN_SHA" <<'PY'
          import json
          import sys
          from pathlib import Path
          from tools.analytics.arena_experiment_validation import validate_experiment_records

          results = Path(sys.argv[1])
          games_expected = int(sys.argv[2])
          frozen_sha = sys.argv[3]
          records = [json.loads(line) for line in results.read_text(encoding='utf-8').splitlines() if line.strip()]
          if not records:
              raise SystemExit('calibration JSONL is empty')
          experiment = records[0].get('experiment')
          if not isinstance(experiment, dict):
              raise SystemExit('calibration JSONL is missing experiment metadata')
          if experiment.get('challenger_version') != frozen_sha or experiment.get('baseline_version') != frozen_sha:
              raise SystemExit('Arena provenance does not match frozen calibration engine')
          audit = validate_experiment_records(
              records,
              {
                  'challenger_version': frozen_sha,
                  'baseline_version': frozen_sha,
                  'rules_version': frozen_sha,
                  'node_budget': int(experiment['node_budget']),
                  'games': games_expected,
                  'opening_count': int(experiment['opening_count']),
              },
          )
          print(json.dumps(audit, ensure_ascii=False, indent=2))
          if audit['invalid_games'] or audit['incomplete_valid_pair_ids']:
              raise SystemExit('calibration artifacts failed dataset validation')
          PY
          python tools/analytics/strength_dataset.py audit "$DATASET" --bootstrap-samples 2000 --seed 0

      - name: Upload calibration artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: redwar-strength-calibration-${{ env.CALIBRATION_RUN_ID }}-${{ github.run_id }}
          path: /tmp/redwar-calibration/
          if-no-files-found: error
          retention-days: 90

      - name: Cleanup frozen worktree
        if: always()
        shell: bash
        run: git worktree remove --force /tmp/redwar-frozen || true
