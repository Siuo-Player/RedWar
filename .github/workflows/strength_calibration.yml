name: RedWar Strength Calibration Controls

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Predeclared calibration run_id from 2026-08-29 protocol-v3 plan'
        required: true
        default: 'aa-baseline-a-v1'
        type: choice
        options:
          - aa-baseline-a-v1
          - aa-baseline-b-v1
  push:
    branches:
      - 'calibration/strength/**'

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  CALIBRATION_PLAN: 'data/arena/strength/plans/2026-08-29-aa-calibration-v1.json'
  CALIBRATION_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.run_id || 'aa-baseline-a-v1' }}
  CALIBRATION_GAMES: '100'
  CALIBRATION_SELECTION_POLICY: 'aa-calibration-v3-fixed-context'
  CALIBRATION_CONTROLLER_POPULATION: 'same-engine-aa-v1'
  CALIBRATION_SKILL_CONTEXT: 'fixed-node-budget-250k'

jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve frozen calibration engine
        shell: bash
        run: |
          set -euo pipefail
          FROZEN_SHA=$(python - <<'PY'
          import json
          import os
          from pathlib import Path
          plan = json.loads(Path(os.environ['CALIBRATION_PLAN']).read_text(encoding='utf-8'))
          run_id = os.environ['CALIBRATION_RUN_ID']
          allowed_runs = {'aa-baseline-a-v1', 'aa-baseline-b-v1'}
          if run_id not in allowed_runs:
              raise SystemExit(f'run {run_id} is outside the calibration execution allowlist')
          if plan.get('promotion_authority') is not False:
              raise SystemExit('calibration plan must not have promotion authority')
          run = next(item for item in plan['runs'] if item['run_id'] == run_id)
          if not run.get('execution_ready', False) or run['role'] != 'calibration':
              raise SystemExit(f'run {run_id} is not an execution-ready calibration run')
          if run['challenger_version'] != run['baseline_version']:
              raise SystemExit('calibration controls require identical challenger/baseline revisions')
          print(run['challenger_version'])
          PY
          )
          echo "FROZEN_SHA=$FROZEN_SHA" >> "$GITHUB_ENV"
          git fetch origin "$FROZEN_SHA" --no-tags
          git worktree add --detach /tmp/redwar-frozen "$FROZEN_SHA"
          pushd /tmp/redwar-frozen/ai/cpp_engine >/dev/null
          cpp_sources=(board.cpp evaluate.cpp main.cpp movegen.cpp search.cpp)
          if [[ -f nnue.cpp ]]; then cpp_sources+=(nnue.cpp); fi
          g++ -std=c++17 -O3 -march=native -mtune=native -flto -DNDEBUG -pipe "${cpp_sources[@]}" -o engine
          chmod +x engine
          popd >/dev/null

      - name: Execute predeclared calibration run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/redwar-calibration
          python tools/analytics/strength_calibration_runner.py \
            "$CALIBRATION_PLAN" \
            --run-id "$CALIBRATION_RUN_ID" \
            --challenger-engine /tmp/redwar-frozen/ai/cpp_engine/engine \
            --baseline-engine /tmp/redwar-frozen/ai/cpp_engine/engine \
            --games "$CALIBRATION_GAMES" \
            --selection-policy "$CALIBRATION_SELECTION_POLICY" \
            --controller-population "$CALIBRATION_CONTROLLER_POPULATION" \
            --skill-context "$CALIBRATION_SKILL_CONTEXT" \
            --results "/tmp/redwar-calibration/$CALIBRATION_RUN_ID-games.jsonl" \
            --dataset "/tmp/redwar-calibration/$CALIBRATION_RUN_ID-dataset.json"

      - name: Validate generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          RESULTS="/tmp/redwar-calibration/$CALIBRATION_RUN_ID-games.jsonl"
          DATASET="/tmp/redwar-calibration/$CALIBRATION_RUN_ID-dataset.json"
          PROVENANCE="/tmp/redwar-calibration/$CALIBRATION_RUN_ID-dataset.run-provenance.json"
          python - "$CALIBRATION_PLAN" "$CALIBRATION_RUN_ID" "$RESULTS" "$CALIBRATION_GAMES" "$FROZEN_SHA" "$CALIBRATION_SELECTION_POLICY" "$CALIBRATION_CONTROLLER_POPULATION" "$CALIBRATION_SKILL_CONTEXT" "$PROVENANCE" <<'PY'
          import json
          import sys
          from pathlib import Path
          from tools.analytics.arena_experiment_validation import validate_experiment_records

          plan_path = Path(sys.argv[1])
          run_id = sys.argv[2]
          results = Path(sys.argv[3])
          games_expected = int(sys.argv[4])
          frozen_sha = sys.argv[5]
          selection_policy = sys.argv[6]
          controller_population = sys.argv[7]
          skill_context = sys.argv[8]
          provenance_path = Path(sys.argv[9])

          plan = json.loads(plan_path.read_text(encoding='utf-8'))
          run = next(item for item in plan['runs'] if item['run_id'] == run_id)
          if plan.get('promotion_authority') is not False:
              raise SystemExit('calibration plan must not have promotion authority')
          if run['role'] != 'calibration' or not run.get('execution_ready', False):
              raise SystemExit('selected run is not an execution-ready calibration run')
          if run['challenger_version'] != frozen_sha or run['baseline_version'] != frozen_sha or run['rules_version'] != frozen_sha:
              raise SystemExit('selected run provenance does not match frozen calibration engine')
          if int(run['node_budget']) != 250000:
              raise SystemExit('unexpected node budget for protocol-v3 A/A calibration')
          if len(run['opening_seeds']) != 16:
              raise SystemExit('protocol-v3 A/A calibration requires 16 predeclared opening seeds')

          records = [json.loads(line) for line in results.read_text(encoding='utf-8').splitlines() if line.strip()]
          if not records:
              raise SystemExit('calibration JSONL is empty')
          experiment = records[0].get('experiment')
          if not isinstance(experiment, dict):
              raise SystemExit('calibration JSONL is missing experiment metadata')
          if experiment.get('challenger_version') != frozen_sha or experiment.get('baseline_version') != frozen_sha:
              raise SystemExit('Arena provenance does not match frozen calibration engine')
          if experiment.get('node_budget') != int(run['node_budget']):
              raise SystemExit('Arena node budget does not match the frozen protocol run')
          if experiment.get('opening_count') != len(run['opening_seeds']):
              raise SystemExit('Arena opening count does not match the frozen protocol run')
          if experiment.get('seed_policy') != run['seed_policy']:
              raise SystemExit('Arena seed policy does not match the selected protocol run')

          audit = validate_experiment_records(
              records,
              {
                  'challenger_version': frozen_sha,
                  'baseline_version': frozen_sha,
                  'rules_version': frozen_sha,
                  'node_budget': int(run['node_budget']),
                  'games': games_expected,
                  'opening_count': len(run['opening_seeds']),
              },
          )
          print(json.dumps(audit, ensure_ascii=False, indent=2))
          if audit['invalid_games'] or audit['incomplete_valid_pair_ids']:
              raise SystemExit('calibration artifacts failed dataset validation')

          if not provenance_path.is_file():
              raise SystemExit(f'run provenance artifact is missing: {provenance_path}')
          provenance = json.loads(provenance_path.read_text(encoding='utf-8'))
          if provenance.get('experiment_id') != run['experiment_id'] or provenance.get('run_id') != run_id:
              raise SystemExit('run provenance identity does not match the selected protocol run')
          execution = provenance.get('execution', {})
          expected_execution = {
              'challenger_engine_version': frozen_sha,
              'baseline_engine_version': frozen_sha,
              'rules_version': frozen_sha,
              'games': games_expected,
              'node_budget': int(run['node_budget']),
              'opening_seeds': [int(seed) for seed in run['opening_seeds']],
              'seed_policy': run['seed_policy'],
              'seed_generation_rule': run['seed_generation_rule'],
              'selection_policy': selection_policy,
              'controller_population': controller_population,
              'skill_context': skill_context,
              'promotion_authority': False,
          }
          for key, expected in expected_execution.items():
              if execution.get(key) != expected:
                  raise SystemExit(f'run provenance mismatch for {key!r}')

          print(json.dumps({
              'run_id': run_id,
              'promotion_authority': False,
              'provenance_validated': True,
          }, ensure_ascii=False, indent=2))
          PY
          python tools/analytics/strength_dataset.py audit "$DATASET" --bootstrap-samples 2000 --seed 0

      - name: Upload calibration artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: redwar-strength-calibration-${{ env.CALIBRATION_RUN_ID }}-${{ github.run_id }}
          path: /tmp/redwar-calibration/
          if-no-files-found: error
          retention-days: 90

      - name: Cleanup frozen worktree
        if: always()
        shell: bash
        run: git worktree remove --force /tmp/redwar-frozen || true
