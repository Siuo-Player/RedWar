name: temporary C4 TWC autofix

on:
  push:
    branches:
      - fix/c4-temporary-twc-timers-special-spells

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix(c4): correct temporary-piece TWC semantics'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact C4 TWC correction
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('ai/cpp_engine/board.cpp')
          text = path.read_text(encoding='utf-8')

          attack_old = '''    } else if (m.type == "ATTACK") {
        board.twc = 0;
'''
          attack_new = '''    } else if (m.type == "ATTACK") {
        board.twc = (undo.target_piece.lifespan >= 999) ? 0 : (board.twc + 1);
'''
          stun_old = '''            if (target.stun_timer > 0) {
                update_piece(ar, ac, empty);
                board.twc = 0;
            } else {
'''
          stun_new = '''            if (target.stun_timer > 0) {
                update_piece(ar, ac, empty);
                if (target.lifespan >= 999) board.twc = 0;
            } else {
'''

          if text.count(attack_old) != 1:
              raise SystemExit('unexpected ATTACK TWC source shape')
          if text.count(stun_old) != 1:
              raise SystemExit('unexpected STUN TWC source shape')

          text = text.replace(attack_old, attack_new)
          text = text.replace(stun_old, stun_new)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/_autofix_c4_twc.yml

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai/cpp_engine/board.cpp .github/workflows/_autofix_c4_twc.yml
          git diff --cached --check
          git commit -m "fix(c4): correct temporary-piece TWC semantics"
          git push
